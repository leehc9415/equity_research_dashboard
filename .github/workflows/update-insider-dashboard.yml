name: Update insider dashboard

on:
  schedule:
    # 평일 19:37 KST 본 수집, 22:37 KST 보충(늦게 올라온 공시 원문). 둘 다 최근 5일을 다시 받는다.
    # 종가·이중분류는 증시데이터가 국내 장마감 뒤 갱신하는 market-charts 릴리스를 같이 쓴다.
    - cron: '37 10 * * 1-5'
    - cron: '37 13 * * 1-5'
  workflow_dispatch:
    inputs:
      recent:
        description: 다시 받을 최근 일수
        default: '5'

permissions:
  contents: write

concurrency:
  group: update-insider-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: collectors/insider
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collectors/insider/requirements.txt
      - name: Install insider collector
        run: pip install -r requirements.txt
      - name: Test parsers and classification rules
        run: python -m unittest discover tests
      - name: Check OpenDART key
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          if [ -z "$OPENDART_API_KEY" ]; then
            echo "::error::저장소 Secrets에 OPENDART_API_KEY가 없습니다 (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Download stock chart data for closes and sectors (market-charts release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download market-charts -p charts.zip -D "$RUNNER_TEMP" --repo "${{ github.repository }}"
          mkdir -p "$RUNNER_TEMP/charts"
          unzip -q -o "$RUNNER_TEMP/charts.zip" -d "$RUNNER_TEMP/charts"
          echo "Stock charts: $(ls "$RUNNER_TEMP/charts" | wc -l) files"
      - name: Collect recent filings and rebuild screen data
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python collect.py --recent "${{ inputs.recent || '5' }}" --no-raw --workers 6 --price-db "$RUNNER_TEMP/charts" | tee "$RUNNER_TEMP/insider.log"
      - name: Export to the dashboard (기업데이터 > 내부자 거래)
        run: python site_export.py ../../dashboard/insider
      - name: Commit changed insider data
        id: commit
        working-directory: .
        shell: bash
        run: |
          git add collectors/insider/data/days dashboard/insider
          if git diff --cached --quiet; then
            echo "No changed insider data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update insider dashboard data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Summarize
        if: always()
        working-directory: .
        run: |
          {
            echo '## 내부자 거래 수집'
            echo '```'
            grep -E '^[0-9]{8}:|API 호출|화면 데이터|종가|처리' "$RUNNER_TEMP/insider.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: update
    if: needs.update.result == 'success' && (needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-dashboard.yml
    with:
      skip_validate: true   # 수집 job이 파서 테스트를 이미 돌렸고, 바뀐 건 내부자 화면 데이터뿐
