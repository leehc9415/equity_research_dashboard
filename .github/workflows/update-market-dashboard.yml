name: Update market dashboard
run-name: "Update market dashboard · ${{ inputs.region || (endsWith(github.event.schedule, '1-5') && 'kr' || 'global') }}"

on:
  schedule:
    # GitHub drops or delays scheduled runs under load, so each update has backup slots.
    # A slot exits in seconds when that update already succeeded today (see the guard step).
    # Global (daily, '* * *'): 09:17 / 10:07 / 11:37 KST — completed US session and UTC crypto daily close.
    - cron: '17 0 * * *'
    - cron: '7 1 * * *'
    - cron: '37 2 * * *'
    # Korean (weekdays, ending in '1-5'): 17:17 / 18:07 / 19:07 / 20:37 / 22:07 KST — confirmed regular-session close.
    - cron: '17 8 * * 1-5'
    - cron: '7 9 * * 1-5'
    - cron: '7 10 * * 1-5'
    - cron: '37 11 * * 1-5'
    - cron: '7 13 * * 1-5'
  workflow_dispatch:
    inputs:
      region:
        description: Market to refresh
        type: choice
        options: [all, kr, global]
        default: all

permissions:
  contents: write
  actions: read

concurrency:
  group: update-market-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
      REGION: ${{ inputs.region || (endsWith(github.event.schedule, '1-5') && 'kr' || 'global') }}
    defaults:
      run:
        working-directory: collectors/stockdb
    steps:
      - name: Skip a backup slot when today's update already succeeded
        id: guard
        if: github.event_name == 'schedule'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "$REGION" = kr ]; then at='16:40'; else at='08:30'; fi
          since=$(date -u -d "TZ=\"Asia/Seoul\" $today $at" +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/update-market-dashboard.yml/runs?status=success&created=>=$since&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .display_title | select(test(\"· ($REGION|all)$\"))] | length")
          echo "Successful $REGION updates since $since: $count"
          if [ "$count" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collectors/stockdb/requirements.txt
      - name: Install market collector
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt pytest
      - name: Test source-state preservation and collector rules
        if: steps.guard.outputs.skip != 'true'
        run: python -m pytest -q tests
      - name: Restore latest verified source history
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud_state.py pull
      - name: Collect, rebuild indicators, and validate all exported cards
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: python cloud_update.py --region "$REGION"
      - name: Publish stock chart data (release asset, not committed)
        if: steps.guard.outputs.skip != 'true' && env.REGION != 'global'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python chart_publish.py
      - name: Save verified source state for the next run
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud_state.py push --archive data/market-state-next.zip
      - name: Commit changed market exports only
        if: steps.guard.outputs.skip != 'true'
        id: commit
        working-directory: .
        shell: bash
        run: |
          if ! git diff --quiet -- dashboard/markets/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/markets/data
            git commit -m "Update market dashboard data"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 5
            done
            exit 1
          fi
          echo "No changed market data."
          echo "changed=false" >> "$GITHUB_OUTPUT"
      - name: Summarize published market dates
        if: steps.guard.outputs.skip != 'true'
        working-directory: .
        run: |
          python - <<'PY'
          import sys, os
          sys.path.insert(0, 'scripts')
          from validate_market_data import validate_directory
          data = validate_directory()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Verified Market Charts\n')
              for group in data['groups']:
                  f.write(f"- {group['title']}: {group['asof']} ({len(group['cards'])} cards)\n")
          PY

  deploy:
    needs: update
    if: needs.update.result == 'success' && (needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-dashboard.yml
    with:
      skip_validate: true   # the update job already validated the market exports it changed
