name: Update market dashboard

on:
  schedule:
    # 08:17 KST daily: completed US session, macro and crypto.
    - cron: '17 23 * * *'
    # 17:17 KST weekdays: confirmed Korean regular-session close.
    - cron: '17 8 * * 1-5'
  workflow_dispatch:
    inputs:
      region:
        description: Market to refresh
        type: choice
        options: [all, kr, global]
        default: all

permissions:
  contents: write

concurrency:
  group: update-market-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: collectors/stockdb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collectors/stockdb/requirements.txt
      - name: Install market collector
        run: pip install -r requirements.txt pytest
      - name: Test source-state preservation and collector rules
        run: python -m pytest -q tests
      - name: Restore latest verified source history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud_state.py pull
      - name: Collect, rebuild indicators, and validate all exported cards
        env:
          REQUESTED_REGION: ${{ inputs.region }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          region="$REQUESTED_REGION"
          if [ -z "$region" ]; then
            if [ "$RUN_SCHEDULE" = '17 8 * * 1-5' ]; then region=kr; else region=global; fi
          fi
          python cloud_update.py --region "$region"
      - name: Save verified source state for the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud_state.py push --archive data/market-state-next.zip
      - name: Commit changed market exports only
        id: commit
        working-directory: .
        shell: bash
        run: |
          if ! git diff --quiet -- dashboard/markets/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/markets/data
            git commit -m "Update market dashboard data"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 5
            done
            exit 1
          fi
          echo "No changed market data."
          echo "changed=false" >> "$GITHUB_OUTPUT"
      - name: Summarize published market dates
        working-directory: .
        run: |
          python - <<'PY'
          import sys, os
          sys.path.insert(0, 'scripts')
          from validate_market_data import validate_directory
          data = validate_directory()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Verified Market Charts\n')
              for group in data['groups']:
                  f.write(f"- {group['title']}: {group['asof']} ({len(group['cards'])} cards)\n")
          PY

  deploy:
    needs: update
    if: needs.update.result == 'success' && (needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-dashboard.yml
