name: Update DART calendar

on:
  schedule:
    # Hourly, weekdays 09:07-21:07 KST. GitHub may delay or drop scheduled runs.
    - cron: '7 0-12 * * 1-5'
  workflow_dispatch:
    inputs:
      period:
        description: '분기보고서 실적 수집 분기 (예: 2026.3Q). 비우면 실적 시즌일 때만 해당 분기 수집'
        required: false

permissions:
  contents: write

concurrency:
  group: update-dart-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calendar safety rules
        run: python -m unittest discover -s tests -p test_calendar_pipeline.py -v
      - name: Collect filings and retain unavailable originals for retry
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_dart_calendar.py
      - name: Validate calendar
        run: python scripts/validate_calendar_data.py
      - name: Collect quarterly report results (분기보고서, 실적 시즌에만)
        # 시즌(분기 종료 다음 달 둘째 주 월요일 ~ 정기보고서 마감 영업일) 밖이면 스크립트가 바로 종료.
        # 캘린더와 분리: 여기서 실패해도 캘린더 갱신은 진행.
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          pip install -q holidays
          python -m unittest tests/test_quarterly_results.py
          python scripts/update_quarterly_results.py ${{ inputs.period && format('--period {0}', inputs.period) || '' }}
      - name: Commit verified calendar change only
        id: commit
        shell: bash
        run: |
          if ! git diff --quiet -- dashboard/data/calendar-data.json || [ -n "$(git status --porcelain -- dashboard/data/quarterly-results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/data/calendar-data.json
            if [ -f dashboard/data/quarterly-results.json ]; then git add dashboard/data/quarterly-results.json; fi
            git commit -m "Update DART calendar events"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: update
    if: needs.update.result == 'success' && (needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-dashboard.yml
