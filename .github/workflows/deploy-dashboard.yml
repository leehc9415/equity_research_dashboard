name: Deploy investment dashboard

on:
  push:
    branches: [main]
    paths: ['dashboard/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_validate:
        description: Skip tests when the caller already validated the only files it changed
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    if: ${{ !inputs.skip_validate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Test consolidated calendar display rules
        run: node --test tests/calendar_events.test.mjs
      - name: Validate export and calendar data
        run: |
          python scripts/validate_web_data.py
          python scripts/validate_calendar_data.py
          python scripts/validate_market_data.py
  deploy:
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: investment-dashboard-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add stock chart data from the market-charts release (not committed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download market-charts -p charts.zip -D "$RUNNER_TEMP" --repo "${{ github.repository }}"; then
            mkdir -p dashboard/markets/charts
            unzip -q -o "$RUNNER_TEMP/charts.zip" -d dashboard/markets/charts
            echo "Stock charts: $(ls dashboard/markets/charts | wc -l) files"
          else
            echo "::warning::market-charts release not available; deploying without stock chart data"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
      - uses: actions/deploy-pages@v4
        id: deployment
