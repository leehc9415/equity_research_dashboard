name: Deploy investment dashboard

on:
  push:
    branches: [main]
    paths: ['dashboard/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Test consolidated calendar display rules
        run: node --test tests/calendar_events.test.mjs
      - name: Validate export and calendar data
        run: |
          python scripts/validate_web_data.py
          python scripts/validate_calendar_data.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: investment-dashboard-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
      - uses: actions/deploy-pages@v4
        id: deployment
