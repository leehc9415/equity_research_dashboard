# =====================================================================
# 미국 지수·섹터 ETF 유니버스 (리송버그 '미국 지수·섹터 ETF' 원형)
# ---------------------------------------------------------------------
# 원형에서 확인된 사실 (PDF 스크린샷, 2026-10-30 기준)
#   - 데이터: 야후 파이낸스 일봉
#   - 배치: 지수 4개 고정 후, SPY 대비 3개월 상대수익률 내림차순
#   - 강조 테두리: 오늘 일·주·월 뱃지 방향이 하나라도 바뀐 카드
#   - 카드 클릭 → Yahoo Finance 구성종목(holdings) 페이지
#   - 지수 카드 하단: 1개월 · 52주 고점 대비 / 섹터 카드 하단: 1개월 · 3개월 상대(%p)
#
# category: index(지수) / sector(GICS 섹터) / industry(세부 산업) / theme(테마) / country(국가)
# =====================================================================

group:
  id: US_SECTOR_ETF
  title: 미국 지수·섹터 ETF
  market: US
  benchmark: SPY
  sort: rel_3m_desc
  card_footer: [ret_1m, rel_3m]
  pinned_footer: [ret_1m, dd_52w]
  link_template: "https://finance.yahoo.com/quote/{ticker}/holdings"

defaults: {source: yf, asset_class: etf, currency: USD}

pinned:
  - {id: SPY,  name: S&P 500,          category: index}
  - {id: QQQ,  name: 나스닥100,        category: index}
  - {id: IWM,  name: 러셀2000,         category: index}
  - {id: RSP,  name: S&P 500 동일가중, category: index}

