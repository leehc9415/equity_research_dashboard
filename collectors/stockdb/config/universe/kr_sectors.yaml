# =====================================================================
# 한국 업종 유니버스 (리송버그 '한국 섹터 차트' 원형)
# ---------------------------------------------------------------------
# 구조
#   네이버 업종(약 79개)  --(이 파일의 매핑)-->  자체 섹터 21개  --(시총가중)-->  섹터 지수
#
# 원형에서 확인된 사실 (PDF 스크린샷)
#   - 섹터 카드: 섹터명 + 구성 종목 수 + 당일 등락 + 2년 스파크라인 + 일/주/월 뱃지
#   - 드릴다운 헤더: "게임 27종목 · 시총가중 (시총 300억↑)"
#   - 드릴다운 하단: "포함 네이버 업종 — 게임엔터테인먼트 27"
#   - 카드 하단: "1개월 수익률 · 3개월 상대수익률(코스피 대비, %p)"
#   - 배치: 코스피·코스닥 고정 후, 3개월 상대수익률 내림차순
#
# ref_count = 스크린샷에 표시된 종목 수(2026-10-30 기준, 300dpi로 다시 판독. 반도체는 156/158 판독 불확실).
#             매핑 검증용 참고치일 뿐 정답이 아님. build 스크립트가 실제 개수와 비교해 출력.
#
# 업종명 매칭은 공백·쉼표·가운뎃점을 제거한 뒤 비교하므로
# "섬유,의류,신발,호화품" / "섬유 의류 신발 호화품" 모두 같은 업종으로 인식됨.
# =====================================================================

group:
  id: KR_SECTOR
  title: 한국 업종
  market: KR
  benchmark: KS11              # 상대수익률 기준 (코스피)
  sort: rel_3m_desc            # pinned 제외 나머지는 3개월 상대수익률 내림차순
  card_footer: [ret_1m, rel_3m]
  pinned_footer: [ret_1m, dd_52w]

# 섹터 지수 산출 규칙
index_rules:
  weighting: mcap              # 시총가중
  weight_basis: prev_close     # 전일 시총 비중으로 당일 수익률 가중 (매일 리밸런싱)
  min_mcap_krw_100m: 300       # 시총 300억 이상만 편입 (단위: 억원)
  base_value: 100
  exclude:
    preferred_shares: false    # 원형은 우선주 포함 (섹터별 종목 수가 우선주 포함 시 일치)
    spac: true                 # 스팩 제외 (종목명에 '스팩')
    markets: [KONEX]           # 코넥스 제외

# 고정 카드 (지수)
pinned:
  - {id: KS11, name: 코스피, source: fdr, ticker: KS11, yf: "^KS11"}
  - {id: KQ11, name: 코스닥, source: fdr, ticker: KQ11, yf: "^KQ11"}

# 자체 섹터 21개 ← 네이버 업종 매핑
# order = 원형 화면의 기본 순서(정렬 데이터가 없을 때만 사용)
