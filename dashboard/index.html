<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investment Dashboard · 수출데이터</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="overrides.css">
  <link rel="stylesheet" href="site-shell.css">
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div class="site-header-inner">
        <div class="brand"><span class="brand-mark">↗</span><div><b>INVESTMENT<br>DASHBOARD</b><small>PERSONAL DATA TERMINAL</small></div></div>
        <nav class="global-nav" aria-label="투자 대시보드 메뉴">
          <button data-section="home">홈</button>
          <button data-section="exports" class="active">수출데이터</button>
          <button data-section="markets">증시데이터</button>
          <button data-section="briefing">시황</button>
          <button data-section="companies">기업데이터</button>
        </nav>
        <div class="global-note">PRIVATE WORKSPACE <span class="live-dot"></span></div>
      </div>
    </header>
    <div class="workspace">
      <section class="export-shell" id="export-shell">
        <div class="export-intro">
          <div><div class="eyebrow">DATA LIBRARY <span class="slash">/</span> EXPORTS</div><h1>수출데이터</h1><p>한국 수출의 흐름을 산업과 품목까지 내려가며 살펴봅니다.</p></div>
          <div class="data-stamp"><span class="stamp-label">DATA STATUS</span><strong id="asof">기준월 —</strong><span id="data-status">확정 데이터</span><small id="last-updated">최근 업데이트 —</small></div>
        </div>
        <div class="export-toolbar">
          <nav class="main-nav" aria-label="수출데이터 화면">
            <button data-page="overview" class="active">종합</button>
            <button data-page="industry">산업별 수출</button>
            <button data-page="items">품목별 수출</button>
          </nav>
          <div class="period-picker" aria-label="공통 조회 기간">
            <span class="period-label">기간</span>
            <div class="preset-buttons">
              <button data-preset="1Y" class="active">1Y</button><button data-preset="3Y">3Y</button><button data-preset="5Y">5Y</button><button data-preset="10Y">10Y</button><button data-preset="ALL">전체</button><button data-preset="CUSTOM">직접</button>
            </div>
            <div class="custom-range" id="custom-range" hidden>
              <input type="month" id="start-month" aria-label="시작월"><span>—</span><input type="month" id="end-month" aria-label="종료월">
            </div>
          </div>
        </div>
        <div class="export-context"><span id="breadcrumb">종합</span><span class="context-dot">·</span><span id="source-status">데이터 불러오는 중</span></div>
      </section>
      <main id="app"><div class="loading">실제 수출 데이터를 불러오는 중입니다…</div></main>
    </div>
  </div>
  <script type="module" src="app.js?v=20261007-industry-cards-and-subsectors"></script>
</body>
</html>
