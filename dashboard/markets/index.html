<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차트북</title>
<style>
:root{
  --bg:#eef0f5; --card:#fff; --ink:#1b2236; --sub:#6b7280; --line:#e5e7eb;
  --px:#1f2a44; --ma:#f0913a; --up:#e0383e; --dn:#2f6fdf; --flat:#9ca3af;
  --up-bg:#fdecec; --dn-bg:#e9f0fd; --hl:#f0913a; --chip:#f3f4f6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131b; --card:#171c27; --ink:#e7eaf0; --sub:#9aa3b2; --line:#2a3140;
    --px:#d5dbe7; --ma:#f0913a; --up:#ff5a5f; --dn:#5b8ff9; --flat:#6b7280;
    --up-bg:#3a1e22; --dn-bg:#1c2940; --chip:#222837;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131b; --card:#171c27; --ink:#e7eaf0; --sub:#9aa3b2; --line:#2a3140;
  --px:#d5dbe7; --ma:#f0913a; --up:#ff5a5f; --dn:#5b8ff9; --flat:#6b7280;
  --up-bg:#3a1e22; --dn-bg:#1c2940; --chip:#222837;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg)}
.bar{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ptitle{font-weight:800;font-size:15px;letter-spacing:-.02em}
.tabs[hidden],.tf[hidden]{display:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs{background:var(--chip);border-radius:9px;padding:2px}
.tab{border:0;background:none;color:var(--sub);font:inherit;font-size:13px;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tf{margin-left:auto;display:flex;gap:4px}
.tf button{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer}
.tf button.on{color:var(--ink);border-color:var(--ink)}
main{max-width:1500px;margin:0 auto;padding:12px 16px 40px}
.note{color:var(--sub);font-size:12px;margin:2px 0 10px}
.note b{color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.tools select,.tools input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.back{border:0;background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer}
h2{font-size:18px;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.sep{grid-column:1/-1;height:0}
.card{background:var(--card);border-radius:12px;padding:10px 12px 8px;border:1.5px solid transparent;cursor:pointer;min-width:0}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card.hl{border-color:var(--hl)}
.top{display:flex;align-items:baseline;gap:6px;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.tk{color:var(--sub);font-size:11px;white-space:nowrap}
.chg{margin-left:auto;font-weight:700;white-space:nowrap}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--flat)}
svg.ch{display:block;width:100%;height:auto;margin:4px 0 2px}
svg.ch text{font-size:9px;fill:var(--sub)}
svg.ch .lab{font-size:10.5px;font-weight:700;fill:var(--ink)}
.bot{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.bd{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid transparent;cursor:pointer;background:var(--chip);color:var(--flat)}
.bd.u{background:var(--up-bg);color:var(--up)} .bd.d{background:var(--dn-bg);color:var(--dn)}
.bd.on{border-color:currentColor}
.ft{margin-left:auto;color:var(--sub);font-size:11px;white-space:nowrap}
.foot{color:var(--sub);font-size:12px;margin-top:14px}
.empty{color:var(--sub);padding:30px 0}
.modes{display:flex;gap:0;overflow-x:auto}
.mode{border:0;border-bottom:3px solid transparent;background:none;color:#8494a6;font:inherit;font-size:13px;font-weight:700;padding:12px 17px 11px;cursor:pointer;white-space:nowrap}
.mode:hover{color:#1f675c}
.mode.on{color:#1f675c;border-bottom-color:#39b594}
:root[data-theme="dark"] .mode.on{color:#4fdbb0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mode.on,:root:not([data-theme="light"]) .mode:hover{color:#4fdbb0}}
.asof{color:var(--sub);font-size:11px;margin-right:6px}
.seg{display:inline-flex;gap:2px;background:var(--chip);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--sub);font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rrgwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:900px){.rrgwrap{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:12px;padding:12px;min-width:0}
svg.rrg{display:block;width:100%;height:auto}
svg.rrg text{font-size:11px;fill:var(--sub)}
svg.rrg .ql{font-size:13px;font-weight:800;opacity:.55}
svg.rrg .sl{font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px}
svg.rrg g.s{cursor:pointer}
svg.rrg g.s path,svg.rrg g.s circle.t{pointer-events:none}
svg.rrg g.s.dim{opacity:.18}
svg.rrg g.s .tl{display:none}
svg.rrg g.s:hover .tl,svg.rrg g.s.sel .tl,svg.rrg.all g.s .tl{display:inline}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:12px;color:var(--sub);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.l,table.t td.l{text-align:left}
table.t td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr.sel td{background:var(--chip)}
table.t tr.idx td{background:var(--chip);font-weight:600}
table.sectbl tbody tr{cursor:pointer}
table.sectbl td.sub{color:var(--sub);font-size:12px}
.wbar{display:inline-block;width:70px;height:9px;border:1px solid #6b8fd6;border-radius:5px;margin-right:6px;vertical-align:middle;overflow:hidden}
.wbar i{display:block;height:100%;background:#dbe6fb}
@media (max-width:700px){table.sectbl .upj{display:none}.wbar{width:34px}}
table.t tbody tr:hover td{background:var(--chip)}
.q{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff}
.q-주도{background:#e0383e}.q-약화{background:#f0913a}.q-소외{background:#2f6fdf}.q-개선{background:#22a06b}
.strong{font-weight:800;color:var(--up)}
.tw{overflow-x:auto;background:var(--card);border-radius:12px;padding:4px 8px}
.chipx{display:inline-flex;gap:6px;align-items:center;background:var(--ink);color:var(--card);font-size:12px;font-weight:700;padding:3px 10px;border-radius:14px;cursor:pointer}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:6px 16px;border-radius:8px;cursor:pointer}
a.sn{color:inherit;text-decoration:none;font-weight:700}
a.sn:hover{text-decoration:underline}
.code{color:var(--sub);font-size:11px;margin-left:4px}
.mh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:2px 2px 8px}
.lnk{margin-left:auto;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.madd select{width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.mlist{max-height:470px;overflow-y:auto}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.mrow.mhd{cursor:default;color:var(--sub);font-size:12px;margin-top:8px}
.mrow:not(.mhd):hover,.mrow.sel{background:var(--chip)}
.qd{width:10px;height:10px;border-radius:50%;flex:none}
.mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mc{width:58px;text-align:right;white-space:nowrap}
.mx{border:0;background:none;color:var(--sub);cursor:pointer;font-size:12px;padding:2px 4px}
.mx:hover{color:var(--up)}
.quads{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:flex-start}
.qcol{background:var(--card);border-radius:12px;padding:8px 12px;min-width:150px;flex-basis:0}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.qitems{display:flex;flex-wrap:wrap;gap:6px}
.qi{display:inline-flex;gap:6px;align-items:baseline;background:var(--chip);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent}
.qi span{font-size:11px;font-weight:600}
.qi.sel{border-color:var(--ink)}
.cform{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;display:grid;gap:6px}
.cform input,.cform textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:100%}
.cform textarea{min-height:70px;resize:vertical}
.cbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.del{color:var(--up)}
.cmsg{font-size:12px;color:var(--sub)}
.nhtbl td.sp{padding:2px 6px}
svg.sp{display:block;width:120px;height:30px}
.pos{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--chip);position:relative;vertical-align:middle}
.pos i{position:absolute;top:-2px;width:3px;height:10px;border-radius:2px;background:var(--px)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px;background:var(--up-bg);color:var(--up)}
.tag.t2{background:var(--chip);color:var(--sub)}
tr.grp td{background:var(--chip);font-weight:700;border-bottom:0;padding-top:8px}
.st{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff}
.st-돌파{background:#e0383e}.st-임박{background:#f0613a}.st-근접{background:#f0913a}.st-관찰{background:#9aa3b2}.st-터치{background:#2f6fdf}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.chips2 button{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;cursor:pointer}
.chips2 button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.flowbars{display:flex;align-items:flex-end;gap:2px;height:90px;padding:6px 4px 0}
.flowbars div{flex:1;background:var(--line);border-radius:2px 2px 0 0;min-height:1px;position:relative}
.flowbars div.win{background:var(--up)}
.flowx{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:2px 4px 0}
.dv{position:relative;height:10px;width:140px;background:transparent;display:inline-block;vertical-align:middle}
.dv:before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.dv i{position:absolute;top:1px;height:8px;border-radius:2px}
.cscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:4px 0 12px}
.csc{background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.csc:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.csc.on{border-color:var(--ink)}
.csc .h{display:flex;align-items:baseline;gap:6px}
.csc .h b{font-size:14px}
.csc .h span{margin-left:auto;font-size:18px;font-weight:800}
.csc p{margin:4px 0 0;font-size:11.5px;color:var(--sub);line-height:1.35}
.new{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--up);color:#fff}
.days{font-size:11px;color:var(--sub)}

/* 종목차트 */
.sc-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
.sc-search{position:relative}
.sc-search input{width:230px;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.sc-sug{position:absolute;top:100%;left:0;z-index:20;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.14);margin-top:4px;padding:4px;display:none}
.sc-sug.on{display:block}
.sc-sug div{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.sc-sug div.hi,.sc-sug div:hover{background:var(--chip)}
.sc-recent{display:flex;gap:6px;flex-wrap:wrap}
.sc-recent button{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer}
.sc-head{display:flex;gap:10px 14px;align-items:baseline;flex-wrap:wrap;background:var(--card);border-radius:10px 10px 0 0;padding:12px 14px 6px}
.sc-head h2{margin:0;font-size:20px;letter-spacing:-.02em}
.sc-head .px{font-size:20px;font-weight:800}
.sc-head .meta{color:var(--sub);font-size:12px}
.sc-head a{color:var(--sub);font-size:12px}
.sc-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);padding:0 14px 8px}
.sc-ctl label{font-size:12px;color:var(--sub);display:flex;gap:4px;align-items:center;cursor:pointer}
.sc-box{position:relative;background:var(--card);border-radius:0 0 10px 10px;padding:0 6px 8px}
#scchart{height:660px}
.sc-leg{position:absolute;left:14px;top:2px;z-index:3;font-size:12px;pointer-events:none;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 90px)}
.sc-leg b{font-weight:700}
.sc-plab{position:absolute;left:14px;z-index:3;font-size:11px;color:var(--sub);pointer-events:none}
@media (max-width:700px){#scchart{height:560px}.sc-search input{width:170px}.sc-head h2,.sc-head .px{font-size:17px}.sc-leg{font-size:10px;gap:2px 6px;max-width:calc(100% - 70px)}.sc-plab{font-size:10px}}

/* 리스트 ↔ 차트 보기 (신고가·차트 셋업) */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:820px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.mgc{background:var(--card);border-radius:10px;padding:8px 8px 4px;min-width:0}
.mgc .mgh{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap;padding:0 4px 4px}
.mgc .mgh .px{font-weight:700}
.mgc .mgm{color:var(--sub);font-size:11.5px;padding:0 4px 4px;display:flex;gap:4px 10px;flex-wrap:wrap}
.mgc .mgm b{color:var(--ink);font-weight:600}
.mgcc{height:300px;position:relative;cursor:pointer}
.mgcc .empty{padding:120px 0;text-align:center}
.mgmore{margin:12px auto 0;display:block}
</style>
</head>
<body>
<header>
  <div class="bar"><span class="ptitle" id="ptitle"></span><span class="asof" id="asof"></span><nav class="tabs" id="tabs" aria-label="Chart Book 그룹"></nav><div class="tf" id="tf" title="모든 카드의 봉 단위"></div></div>
</header>
<main id="main"><div class="empty">데이터를 불러오는 중…</div></main>

<script src="data/overview.js"></script>
<script src="vendor/lightweight-charts-5.1.0.js" defer></script>
<script>
"use strict";
const D = window.DASH_OVERVIEW;
const TABS = [["kr","KR_SECTOR","한국 업종"],["us","US_SECTOR_ETF","미국 지수·섹터"],["macro","MACRO","상품·통화·금리"]];
const TF = [["d","일"],["w","주"],["m","월"]];
const EPOCH = Date.UTC(2000,0,1), DAY = 864e5;
const BENCH = {KS11:"코스피", SPY:"SPY"};
let gTF = "d";
const cardTF = new Map();          // 카드별로 바꾼 봉 단위
const $ = (s, el=document) => el.querySelector(s);

// ---------------------------------------------------------------- 포맷
const sign = v => v > 0 ? "+" : "";
const cls = v => v == null ? "fl" : v > 0.00005 ? "up" : v < -0.00005 ? "dn" : "fl";
const pct = (v, nd=1) => v == null ? "–" : sign(v) + (v*100).toFixed(nd) + "%";
const pp = v => v == null ? "–" : sign(v) + Math.round(v*100) + "%p";
const pct0 = v => v == null ? "–" : sign(v) + Math.round(v*100) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function footer(c, keys){
  const f = {
    ret_1m: () => `1개월 ${pct0(c.ret_1m)}`,
    rel_3m: () => `3개월 상대 ${pp(c.rel_3m)}`,
    dd_52w: () => `52주 고점 대비 ${pct0(c.dd_52w)}`,
    rs:     () => `RS ${c.rs ?? "–"}`,
  };
  return keys.map(k => f[k] ? f[k]() : "").filter(Boolean).join(" · ");
}

// ---------------------------------------------------------------- 차트
function decode(s){
  const t = new Array(s.t.length); let d = 0;
  for (let i = 0; i < s.t.length; i++){ d += s.t[i]; t[i] = d; }
  return t;
}
function sma(c, n){
  const out = new Array(c.length).fill(null); let sum = 0;
  for (let i = 0; i < c.length; i++){
    sum += c[i]; if (i >= n) sum -= c[i-n];
    if (i >= n-1) out[i] = sum / n;
  }
  return out;
}
function chartSVG(card, tf){
  const s = card.series && card.series[tf];
  const W = 260, H = 92, L = 2, R = 46, T = 6, B = 16;
  if (!s || !s.c || s.c.length < 2) return `<svg class="ch" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle">데이터 없음</text></svg>`;
  const days = decode(s), ma = sma(s.c, D.ma[tf]);
  const c = s.c.slice(s.k), m = ma.slice(s.k), t = days.slice(s.k);
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < c.length; i++){
    lo = Math.min(lo, c[i], m[i] ?? Infinity); hi = Math.max(hi, c[i], m[i] ?? -Infinity);
  }
  if (hi === lo){ hi += 1; lo -= 1; }
  const x = i => L + (W - L - R) * i / (c.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const path = arr => { let p = "", pen = false;
    arr.forEach((v, i) => { if (v == null){ pen = false; return; }
      p += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; }); return p; };
  // x축 눈금: 일봉 1·7월, 주·월봉 1월
  let ticks = "", pm = -1;
  for (let i = 0; i < t.length; i++){
    const dt = new Date(EPOCH + t[i]*DAY), mo = dt.getUTCMonth();
    if (pm !== -1 && mo !== pm && (tf === "d" ? (mo === 0 || mo === 6) : mo === 0)){
      const lab = String(dt.getUTCFullYear()).slice(2) + (tf === "d" ? "." + String(mo+1).padStart(2,"0") : "");
      ticks += `<text x="${x(i).toFixed(1)}" y="${H-3}" text-anchor="middle">${lab}</text>`;
    }
    pm = mo;
  }
  const cum = c[c.length-1] / c[0] - 1, ly = y(c[c.length-1]);
  return `<svg class="ch" viewBox="0 0 ${W} ${H}">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
    <path d="${path(m)}" fill="none" stroke="var(--ma)" stroke-width="1.3"/>
    <path d="${path(c)}" fill="none" stroke="var(--px)" stroke-width="1.2" stroke-linejoin="round"/>

function sortCards(list, key, dir=-1){
  return list.slice().sort((a, b) => {
    const va = a[key], vb = b[key];
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return dir * (va - vb);
  });
}
function renderGroup(tab){

    + ` · 데이터 ${g.asof || "–"} 기준`;

async function ensurePX(){
  if (PX) return PX;
  if (!window.DASH_RS_PX) await loadScript("data/rs_px.js");
  const D0 = window.DASH_RS_PX, T = D0.dates.length;
  const pos = Object.fromEntries(D0.codes.map((c, i) => [c, i]));
  const level = r => {            // 일간 수익률(bp) → 마지막 날 = 1 인 상대 가격, 상장 전은 null
    const fi = r.findIndex(v => v != null), lev = new Array(T).fill(null);
    if (fi < 0) return lev;
    lev[T - 1] = 1;
    for (let t = T - 1; t >= Math.max(1, fi); t--) lev[t - 1] = lev[t] / (1 + (r[t] ?? 0) / 1e4);
    return lev;
  };
  const cum = r => { const o = [1]; for (let t = 1; t < T; t++) o.push(o[t - 1] * (1 + (r[t] ?? 0) / 1e4)); return o; };
  PX = {T, dates: D0.dates, pos, level, levCache: {}, bench: Object.fromEntries(Object.entries(D0.bench).map(([k, r]) => [k, cum(r)]))};
  return PX;
}
function basketIndex(codes){
  const D0 = window.DASH_RS_PX, T = PX.T, mem = codes.map(c => PX.pos[c]).filter(i => i != null);
  mem.forEach(i => { if (!PX.levCache[i]) PX.levCache[i] = PX.level(D0.r[i]); });
  const idx = [1];
  for (let t = 1; t < T; t++){
    let num = 0, den = 0;
    for (const i of mem){ const r = D0.r[i][t], l = PX.levCache[i][t - 1];
      if (r == null || l == null) continue; const w = D0.mcap[i] * l; num += w * r / 1e4; den += w; }
    idx.push(idx[t - 1] * (1 + (den ? num / den : 0)));
  }
  return idx;
}
function rrgPointsJS(sec, bench, weeks){
  const p0 = RS.rrg.periods[weeks], v = sec.map((x, i) => x / bench[i]), n = v.length;
  const l = Math.min(p0.days, n - 1), f = Math.max(15, Math.round(l / 2)), p = Math.max(5, Math.round(l / p0.points));
  const end = n - 1, start = end - l, idx = [...new Set(Array.from({length: p0.points}, (_, k) => Math.round(start + (end - start) * k / (p0.points - 1))))];
  return idx.map(i => { const w = v.slice(Math.max(0, i - f), i + 1), avg = w.reduce((a, b) => a + b, 0) / w.length;
    return [Math.round(10000 * v[i] / avg) / 100, Math.round(10000 * v[i] / v[Math.max(0, i - p)]) / 100]; });
}
function registerCustom(c){
  const id = "CU:" + c.name, codes = c.codes.filter(x => PX.pos[x] != null);
  const ix = basketIndex(codes), T = ix.length, chg = k => T > k ? Math.round(10000 * (ix[T - 1] / ix[T - 1 - k] - 1)) / 100 : null;
  SEC[id] = {id, name: c.name, level: "C", parent: null, count: codes.length, codes, chg_1w: chg(5), chg_4w: chg(20)};
  Object.keys(RS.rrg.benchmarks).forEach(b => {

  });
  return id;
}
function resolveStocks(text){

  const ok = [], miss = [];
  text.split(/[,\n;\t]+/).map(t => t.trim()).filter(Boolean).forEach(t => {

function rrgData(){

  }).filter(s => s.ratio != null);

function drawRRG(){
  const data = rrgData(), W = 600, H = 560, L = 44, Rm = 16, T = 16, B = 36;
  // 축 범위: 현재 점 + 보이는 꼬리(선택한 섹터, 또는 '꼬리 모두 보기')만 기준으로
  let span = 0.5;
  data.forEach(s => (RSST.allTails || s.id === RSST.sector ? s.tail : [[s.ratio, s.mom]])
    .forEach(([a, m]) => { span = Math.max(span, Math.abs(a - 100), Math.abs(m - 100)); }));
  const step = [0.5, 1, 2, 5, 10, 20, 50].find(v => (span * 1.1) / v <= 4) || 100;
  span = Math.ceil((span * 1.1) / step) * step;
  const x = v => L + (W - L - Rm) * (v - (100 - span)) / (2 * span);
  const y = v => T + (H - T - B) * (1 - (v - (100 - span)) / (2 * span));
  const cx = x(100), cy = y(100);
  let grid = "";
  for (let v = 100 - span; v <= 100 + span + 1e-9; v += step){
    const vv = Math.round(v * 10) / 10;
    grid += `<line x1="${x(vv)}" x2="${x(vv)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-width="${vv===100?1.5:.6}"/>`
      + `<text x="${x(vv)}" y="${H-B+14}" text-anchor="middle">${vv}</text>`
      + `<line x1="${L}" x2="${W-Rm}" y1="${y(vv)}" y2="${y(vv)}" stroke="var(--line)" stroke-width="${vv===100?1.5:.6}"/>`
      + `<text x="${L-6}" y="${y(vv)+4}" text-anchor="end">${vv}</text>`;
  }
  const tint = (q, x0, y0, x1, y1) => `<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${QCOL[q]}" opacity=".07"/>`;
  const quads = tint("개선", L, T, cx, cy) + tint("주도", cx, T, W-Rm, cy) + tint("소외", L, cy, cx, H-B) + tint("약화", cx, cy, W-Rm, H-B)
    + `<text class="ql" x="${L+8}" y="${T+18}" fill="${QCOL["개선"]}">개선</text>`
    + `<text class="ql" x="${W-Rm-8}" y="${T+18}" text-anchor="end" fill="${QCOL["주도"]}">주도</text>`
    + `<text class="ql" x="${L+8}" y="${H-B-8}" fill="${QCOL["소외"]}">소외</text>`
    + `<text class="ql" x="${W-Rm-8}" y="${H-B-8}" text-anchor="end" fill="${QCOL["약화"]}">약화</text>`;
  const sel = RSST.sector;
  const pts = data.map(s => {
    const c = QCOL[s.q], P = s.tail.map(([a, m]) => [x(a), y(m)]);
    const path = P.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
    const dots = P.slice(0, -1).map((p, i) => `<circle class="t" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(2.4 + 1.6 * i / P.length).toFixed(1)}" fill="${c}" opacity="${(0.35 + 0.5 * i / P.length).toFixed(2)}"/>`).join("");
    const [hx, hy] = P[P.length - 1];
    const tip = `${s.name} · ${s.q}\nRS-Ratio ${s.ratio.toFixed(2)} · RS-Momentum ${s.mom.toFixed(2)}\n1주 ${s.chg_1w == null ? "–" : (s.chg_1w > 0 ? "+" : "") + s.chg_1w.toFixed(1) + "%"} · ${s.count}종목`;
    return `<g class="s ${sel && sel !== s.id ? "dim" : ""} ${sel === s.id ? "sel" : ""}" data-id="${s.id}"><title>${esc(tip)}</title>
      <g class="tl"><path d="${path}" fill="none" stroke="${c}" stroke-width="1.6" opacity=".6"/>${dots}</g>
      <circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="${sel === s.id ? 7 : 5.5}" fill="${c}" stroke="var(--card)" stroke-width="1.5"/>
      <text class="sl" x="${(hx + 8).toFixed(1)}" y="${(hy + 4).toFixed(1)}">${esc(s.name)}</text></g>`;
  }).join("");
  $("#rrg").innerHTML = `<svg class="rrg ${RSST.allTails ? "all" : ""}" viewBox="0 0 ${W} ${H}">${quads}${grid}
    <text x="${(L + W - Rm) / 2}" y="${H-4}" text-anchor="middle">RS-Ratio →</text>
    <text x="12" y="${(T + H - B) / 2}" text-anchor="middle" transform="rotate(-90 12 ${(T + H - B) / 2})">RS-Momentum →</text>
    ${pts}</svg>`;
  $("#rrg").onclick = e => { const g = e.target.closest("g.s"); if (g) setSector(g.dataset.id); };
}

function openForm(name){
  EDIT = name;
  const c = name ? CUSTOM.find(x => x.name === name) : null;
  const nm = c ? c.codes.map(code => (STOCKS.find(s => s.code === code) || {}).name || code).join(", ") : "";
  $("#cform").innerHTML = `<div class="cform">
    <input id="cname" placeholder="섹터 이름 (예: PCB·기판)" value="${esc(c ? c.name : "")}">
    <textarea id="ccodes" placeholder="종목명 또는 종목코드를 쉼표·줄바꿈으로 구분 (예: 이수페타시스, 대덕전자, 007810)">${esc(nm)}</textarea>
    <div class="cbtns"><button class="btn pri" id="csave">저장</button>${c ? `<button class="btn del" id="cdel">삭제</button>` : ""}<button class="btn" id="ccancel">닫기</button>
      <span class="cmsg" id="cmsg"></span></div></div>`;
  $("#ccancel").onclick = () => { EDIT = null; $("#cform").innerHTML = ""; };
  if (c) $("#cdel").onclick = () => {
    const id = "CU:" + c.name; CUSTOM = CUSTOM.filter(x => x !== c); saveCustom();
    ACTIVE = ACTIVE.filter(x => x !== id); saveActive(); delete SEC[id]; if (RSST.sector === id) RSST.sector = null; EDIT = null; drawAll();
  };
  $("#csave").onclick = async () => {
    const name = $("#cname").value.trim().replace(/[<>]/g, ""), msg = $("#cmsg");
    if (!name){ msg.textContent = "이름을 입력하세요"; return; }
    if (CUSTOM.some(x => x.name === name && x !== c)){ msg.textContent = "같은 이름의 섹터가 있어요"; return; }
    msg.textContent = "계산 중…";
    try { await ensurePX(); } catch { msg.textContent = "data/rs_px.js 를 불러오지 못했어요"; return; }
    const {ok, miss} = resolveStocks($("#ccodes").value);
    if (!ok.length){ msg.textContent = "찾은 종목이 없어요" + (miss.length ? ` (못 찾음: ${miss.join(", ")})` : ""); return; }
    if (c){ const old = "CU:" + c.name; delete SEC[old]; ACTIVE = ACTIVE.map(x => x === old ? "CU:" + name : x); if (RSST.sector === old) RSST.sector = "CU:" + name; c.name = name; c.codes = ok; }
    else CUSTOM.push({name, codes: ok});
    saveCustom();
    const id = registerCustom(c || CUSTOM[CUSTOM.length - 1]);
    if (!ACTIVE.includes(id)) ACTIVE.push(id); saveActive();
    EDIT = miss.length ? name : null;
    drawAll();
    if (miss.length) $("#cmsg").textContent = `${ok.length}종목 저장 · 못 찾음: ${miss.join(", ")}`;
  };
}

function drawStocks(){
  const q = RSST.q.trim().toLowerCase();
  const S = RSST.sector ? SEC[RSST.sector] : null;
  let list = STOCKS.filter(s => (!S || (S.level === "L" ? s.sector === S.name : S.level === "C" ? S.codes.includes(s.code) : s.sub === S.name)) && (!RSST.market || s.market === RSST.market)
    && (s.mcap ?? 0) >= RSST.cap && (!RSST.mtt || s.mtt) && (!q || s.name.toLowerCase().includes(q) || s.code.includes(q)));
  const k = RSST.sort, d = RSST.dir;
  const val = s => k === "sector" ? (s.sector || "") + (s.sub || "") : s[k];
  list.sort((a, b) => { const va = val(a), vb = val(b);
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return typeof va === "string" ? d * va.localeCompare(vb) : d * (va - vb); });
  $("#fcnt").textContent = `${list.length.toLocaleString()}개 종목`;
  const rsCell = v => v == null ? "–" : (v >= 80 ? `<span class="strong">${v}</span>` : v);
  const capFmt = v => v == null ? "–" : v >= 10000 ? (v / 10000).toFixed(1) + "조" : v.toLocaleString() + "억";
  const idx = RS.stocks.indices.map(i => `<tr class="idx"><td class="l">지수</td><td class="l">${esc(i.name)}</td><td class="l">-</td>
    <td>${i.close.toLocaleString()}</td><td class="${cls((i.chg_1d ?? 0) / 100)}">${i.chg_1d == null ? "–" : pct(i.chg_1d / 100, 2)}</td>
    <td>${rsCell(i.rs)}</td><td>${i.rs_1m ?? "–"}</td><td>${i.rs_3m ?? "–"}</td><td>${i.rs_6m ?? "–"}</td><td>${i.rs_12m ?? "–"}</td><td>-</td><td>-</td></tr>`).join("");
  const rows = list.slice(0, RSST.limit).map(s => `<tr>
    <td class="l">${esc(s.sector || "미분류")}${s.sub ? `<span class="code">${esc(s.sub)}</span>` : ""}</td>
    <td class="l"><a class="sn" href="#sc/${s.code}">${esc(s.name)}</a><span class="code">${s.code}</span></td>
    <td class="l">${s.market === "KOSPI" ? "코스피" : s.market === "KOSDAQ" ? "코스닥" : esc(s.market || "")}</td>
    <td>${s.close == null ? "–" : s.close.toLocaleString()}</td><td class="${cls((s.chg_1d ?? 0) / 100)}">${s.chg_1d == null ? "–" : pct(s.chg_1d / 100, 2)}</td>
    <td>${rsCell(s.rs)}</td><td>${s.rs_1m ?? "–"}</td><td>${s.rs_3m ?? "–"}</td><td>${s.rs_6m ?? "–"}</td><td>${s.rs_12m ?? "–"}</td>
    <td>${s.mtt ? "✓" : ""}</td><td>${capFmt(s.mcap)}</td></tr>`).join("");
  $("#stk").innerHTML = `<thead><tr>${COLS.map(([c, l, a]) => `<th class="${a}" data-k="${c}">${l}${RSST.sort === c ? (RSST.dir < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>
    <tbody>${RSST.sector ? "" : idx}${rows}</tbody>`;
  $("#stk").querySelector("thead").onclick = e => { const th = e.target.closest("th"); if (!th) return;
    const c = th.dataset.k; if (RSST.sort === c) RSST.dir = -RSST.dir; else { RSST.sort = c; RSST.dir = ["name","sector","market"].includes(c) ? 1 : -1; } drawStocks(); };
  const more = $("#more"); more.hidden = list.length <= RSST.limit;
  more.textContent = `더 보기 (${Math.min(100, list.length - RSST.limit)}개)`;
  more.onclick = () => { RSST.limit += 100; drawStocks(); };
}

// ================================================================ 신고가 (52주 · 20일)
const NH_TABS = [["nh","오늘 신고가"],["nh/cand","신고가 후보"],["nh/flow","섹터 흐름"]];
const NHST = {per: "52", day: null, cap: 1000, val: 20, market: "", touch: false, stage: "전체", csort: "dist", win: 20};
let NH = null, NHR = null;

async function renderNH(sub){
  if (!window.DASH_NH){
    $("#main").innerHTML = `<div class="empty">불러오는 중…</div>`;

  }
  NH = window.DASH_NH;
  if (!NHR){
    const c = NH.cols;
    NHR = NH.rows.map(r => { const o = Object.fromEntries(c.map((k, i) => [k, r[i]])); const st = NH.stocks[o.code] || [];
      o.name = st[0] || o.code; o.market = st[1]; o.sector = st[2]; o.sub = st[3];
      o.v20 = o.vratio ? o.value / o.vratio : null; return o; });
  }
  if (NHST.day == null) NHST.day = NH.days.length - 1;
  const capOpts = [[0,"전체"],[300,"300억+"],[500,"500억+"],[1000,"1,000억+"],[2000,"2,000억+"],[5000,"5,000억+"],[10000,"1조+"]];
  const valOpts = [[0,"전체"],[5,"5억+"],[10,"10억+"],[20,"20억+"],[50,"50억+"],[100,"100억+"]];
  $("#main").innerHTML = `
    <div class="tools">
      <span class="seg" id="nhper">${[["52","52주"],["20","20일"]].map(([k, l]) => `<button data-p="${k}" class="${k===NHST.per?"on":""}">${l} 신고가</button>`).join("")}</span>
      <select id="nhcap" title="시가총액 하한">${capOpts.map(([v, l]) => `<option value="${v}" ${v===NHST.cap?"selected":""}>시총 ${l}</option>`).join("")}</select>
      <select id="nhval" title="20일 평균 거래대금 하한">${valOpts.map(([v, l]) => `<option value="${v}" ${v===NHST.val?"selected":""}>거래대금 ${l}</option>`).join("")}</select>
      <select id="nhmk"><option value="">전체 시장</option><option ${NHST.market==="KOSPI"?"selected":""}>KOSPI</option><option ${NHST.market==="KOSDAQ"?"selected":""}>KOSDAQ</option></select>
      ${sub === "flow" ? "" : viewSeg("nh")}
    </div>
    <div id="nhbody"></div>`;
  const redraw = () => (sub === "cand" ? drawCand : sub === "flow" ? drawFlow : drawToday)();

  $("#nhval").onchange = e => { NHST.val = +e.target.value; redraw(); };
  $("#nhmk").onchange = e => { NHST.market = e.target.value; redraw(); };

const nhBits = () => NHST.per === "52" ? [1, 2] : [4, 8];
const nhPass = r => (r.mcap ?? 0) >= NHST.cap && (r.v20 ?? 0) >= NHST.val && (!NHST.market || r.market === NHST.market);
const fmtV = r => r.value == null ? "–" : `${r.value >= 1000 ? (r.value / 1000).toFixed(1) + "천" : Math.round(r.value)}억${r.vratio ? ` <span class="code">${r.vratio.toFixed(1)}배</span>` : ""}`;
const nhName = r => `<a class="sn" href="#sc/${r.code}">${esc(r.name)}</a><span class="code">${r.code}</span>`;
function nhTags(r){
  return (r.flags & 16 ? `<span class="tag" title="2021년 이후(DB 전체 기간) 최고 종가">21년 이후 최고가</span>` : "") + (NHST.per === "52" && r.flags & 32 ? `<span class="tag t2">신규상장</span>` : "");
}
function spark(code){
  const sp = NH.spark[code]; if (!sp) return "";
  const c = sp.c, hl = NHST.per === "52" ? sp.h52 : sp.h20, W = 120, H = 30;
  const vals = c.filter(v => v != null).concat(hl != null ? [hl] : []);
  const lo = Math.min(...vals), hi = Math.max(...vals), y = v => H - 2 - (H - 4) * (v - lo) / ((hi - lo) || 1), x = i => W * i / (c.length - 1);
  let d = "", pen = false; c.forEach((v, i) => { if (v == null){ pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });
  return `<svg class="sp" viewBox="0 0 ${W} ${H}">${hl != null ? `<line x1="0" x2="${W}" y1="${y(hl)}" y2="${y(hl)}" stroke="var(--up)" stroke-dasharray="3 2" stroke-width="1"/>` : ""}
    <path d="${d}" fill="none" stroke="var(--px)" stroke-width="1.2"/></svg>`;
}
function posBar(p){ return p == null ? "–" : `<span class="pos" title="52주 범위 안 위치 ${Math.round(p * 100)}%"><i style="left:calc(${Math.min(1, Math.max(0, p)) * 100}% - 1px)"></i></span>`; }

function drawToday(){
  miniCleanup();
  const [bN, bT] = nhBits(), day = NHST.day, isLast = day === NH.days.length - 1;
  const rows = NHR.filter(r => r.day === day && nhPass(r) && (r.flags & bN || (NHST.touch && r.flags & bT)));
  const nN = rows.filter(r => r.flags & bN).length, nT = NHR.filter(r => r.day === day && nhPass(r) && r.flags & bT).length;
  const groups = {};
  rows.forEach(r => (groups[r.sector || "미분류"] = groups[r.sector || "미분류"] || []).push(r));
  const gl = Object.entries(groups).map(([k, l]) => [k, l.sort((a, b) => (b.chg ?? 0) - (a.chg ?? 0)), l.reduce((a, r) => a + (r.chg ?? 0), 0) / l.length])
    .sort((a, b) => b[1].length - a[1].length || b[2] - a[2]);
  const per = NHST.per === "52" ? "52주" : "20일";
  const body = gl.map(([k, l, avg]) => `<tr class="grp"><td class="l" colspan="2">${esc(k)} <span class="code">${l.length}종목</span></td>
      <td colspan="${isLast ? 7 : 6}" class="l"><span class="${cls(avg / 100)}">평균 ${pct(avg / 100)}</span></td></tr>`

function nhItem(r, tags){

}

function stageOf(r){
  const [bN, bT] = nhBits(), d = NHST.per === "52" ? r.dist52 : r.dist20;
  if (r.flags & bN) return "돌파"; if (r.flags & bT) return "터치";
  if (d == null || d > NH.cand_max) return null;
  return d <= 3 ? "임박" : d <= 7 ? "근접" : "관찰";
}
function drawCand(){

      <select id="nhsort">${[["dist","고가까지 가까운 순"],["atr","ATR% 큰 순"],["chg","등락률 순"],["value","거래대금 순"],["rs","RS 순"],["sector","섹터 순"]].map(([k, l]) => `<option value="${k}" ${k===NHST.csort?"selected":""}>${l}</option>`).join("")}</select>

function drawFlow(){
  miniCleanup();
  const [bN] = nhBits(), n = NH.days.length, W = NHST.win, per = NHST.per === "52" ? "52주" : "20일";
  const hits = NHR.filter(r => r.flags & bN && nhPass(r));
  const byDay = Array.from({length: n}, () => []);
  hits.forEach(r => byDay[r.day].push(r));
  const counts = byDay.map(l => l.length), mx = Math.max(1, ...counts);
  const win = byDay.slice(n - W), half = Math.floor(W / 2), A = win.slice(0, W - half), B = win.slice(W - half);
  const share = days => { const acc = {}, used = days.filter(l => l.length);
    used.forEach(l => { const c = {}; l.forEach(r => c[r.sector || "미분류"] = (c[r.sector || "미분류"] || 0) + 1);
      Object.entries(c).forEach(([k, v]) => acc[k] = (acc[k] || 0) + v / l.length); });
    Object.keys(acc).forEach(k => acc[k] = 100 * acc[k] / (used.length || 1)); return acc; };
  const sa = share(A), sb = share(B), secs = [...new Set([...Object.keys(sa), ...Object.keys(sb)])];
  const flat = win.flat(), dist = {}, subs = {}, lastRow = {};
  flat.forEach(r => { const k = r.sector || "미분류"; (dist[k] = dist[k] || new Set()).add(r.code);
    const lr = (lastRow[k] = lastRow[k] || {}); if (!lr[r.code] || lr[r.code].day < r.day) lr[r.code] = r; (subs[k] = subs[k] || {}); subs[k][r.sub || "기타"] = (subs[k][r.sub || "기타"] || new Set()).add(r.code); });
  const rows = secs.map(k => ({k, a: sa[k] || 0, b: sb[k] || 0, d: (sb[k] || 0) - (sa[k] || 0), n: dist[k] ? dist[k].size : 0,
    subs: Object.entries(subs[k] || {}).map(([s, set]) => [s, set.size]).sort((x, y) => y[1] - x[1]).slice(0, 3),
    top: Object.values(lastRow[k] || {}).sort((x, y) => (y.mcap ?? 0) - (x.mcap ?? 0)).slice(0, 5)})).sort((x, y) => y.d - x.d);
  const md = Math.max(5, ...rows.map(r => Math.abs(r.d)));
  const dv = d => `<span class="dv"><i style="${d >= 0 ? `left:50%;width:${50 * d / md}%;background:var(--up)` : `right:50%;width:${50 * -d / md}%;background:var(--dn)`}"></i></span>`;
  const top = (l, s) => l.slice(0, 3).map(r => `<b>${esc(r.k)}</b> ${s}${Math.abs(r.d).toFixed(1)}%p`).join(" · ") || "없음";
  $("#nhbody").innerHTML = `
    <div class="note">${per} 신고가 종목이 어느 섹터(이중분류 대분류)에서 나오는지 — 기간을 반으로 나눠 날마다의 섹터 비중을 앞·뒤로 평균해 비교 (신고가가 없던 날은 제외) · 수급(자금 유입)이 아니라 신고가 종목 수 기준</div>
    <div class="tools"><span class="seg" id="nhwin">${[5, 10, 20].map(w => `<button data-w="${w}" class="${w===W?"on":""}">${w}일</button>`).join("")}</span>
      <span class="note" style="margin:0">${NH.days[n - W]} ~ ${NH.asof} · 신고가 ${flat.length}건 (${new Set(flat.map(r => r.code)).size}종목)</span></div>
    <div class="panel"><div class="note" style="margin:0 4px">날짜별 ${per} 신고가 종목 수 (최근 ${n}거래일, 빨간 막대 = 선택 기간)</div>
      <div class="flowbars">${counts.map((c, i) => `<div class="${i >= n - W ? "win" : ""}" style="height:${100 * c / mx}%" title="${NH.days[i]} · ${c}종목"></div>`).join("")}</div>
      <div class="flowx"><span>${NH.days[0]}</span><span>최대 ${mx}종목</span><span>${NH.asof}</span></div></div>
    <div class="note" style="margin-top:12px">비중 늘어남: ${top(rows.filter(r => r.d > 0), "▲")} &nbsp;|&nbsp; 줄어듦: ${top(rows.filter(r => r.d < 0).reverse(), "▼")}</div>
    <div class="tw"><table class="t"><thead><tr><th class="l">섹터</th><th>앞 ${W - half}일 평균</th><th>뒤 ${half}일 평균</th><th>변화</th><th class="l"></th><th>종목 수</th><th class="l">주요 중분류</th><th class="l">주요 종목 (시총 상위, RS)</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td class="l"><b>${esc(r.k)}</b></td><td>${r.a.toFixed(1)}%</td><td>${r.b.toFixed(1)}%</td>
      <td class="${cls(r.d / 100)}">${r.d > 0 ? "▲" : r.d < 0 ? "▼" : ""}${Math.abs(r.d).toFixed(1)}%p</td><td class="l">${dv(r.d)}</td><td>${r.n}</td>
      <td class="l">${r.subs.map(([s, c]) => `${esc(s)} ${c}`).join(" · ")}</td>
      <td class="l">${r.top.map(t => `<a class="sn" href="#sc/${t.code}">${esc(t.name)}</a>(${t.rs ?? "–"})`).join(", ")}</td></tr>`).join("") || `<tr><td colspan="8" class="l"><div class="empty">기간 안에 신고가 종목이 없습니다</div></td></tr>`}</tbody></table></div>`;
  $("#nhwin").onclick = e => { const b = e.target.closest("button"); if (b){ NHST.win = +b.dataset.w; drawFlow(); } };
}

function csList(id){

}
function csSpark(code, line){
  const c = CS.spark[code]; if (!c) return "";
  const W = 120, H = 30, vals = c.concat(line != null ? [line] : []);
  const lo = Math.min(...vals), hi = Math.max(...vals), y = v => H - 2 - (H - 4) * (v - lo) / ((hi - lo) || 1), x = i => W * i / (c.length - 1);
  return `<svg class="sp" viewBox="0 0 ${W} ${H}">${line != null ? `<line x1="0" x2="${W}" y1="${y(line)}" y2="${y(line)}" stroke="var(--up)" stroke-dasharray="3 2"/>` : ""}
    <path d="${c.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("")}" fill="none" stroke="var(--px)" stroke-width="1.2"/></svg>`;
}
function drawCS(){

    return typeof va === "string" ? dir * va.localeCompare(vb) : dir * (va - vb); });
  const th = (k, l, cl = "") => `<th class="${cl}" data-k="${k}">${l}${sk === k ? (dir < 0 ? " ↓" : " ↑") : ""}</th>`;

function scDecode(o){

function scWeekly(x){
  const out = {t: [], o: [], h: [], l: [], c: [], v: [], r: [], ix: []};
  let key = null;
  for (let i = 0; i < x.t.length; i++){
    const d = new Date(x.t[i] + "T00:00:00Z"), mon = new Date(d.getTime() - ((d.getUTCDay() + 6) % 7) * 864e5).toISOString().slice(0, 10);
    if (mon !== key){ key = mon; out.t.push(x.t[i]); out.o.push(x.o[i]); out.h.push(x.h[i]); out.l.push(x.l[i]); out.c.push(x.c[i]); out.v.push(x.v[i]); out.r.push(x.r[i]); out.ix.push(x.ix[i]); }

// 캔들 시리즈에 붙이는 그리기 도구 (Lightweight Charts primitive)
class SCPrim {
  constructor(draw, z){ this._draw = draw; this._views = [{zOrder: () => z, renderer: () => ({draw: t => t.useMediaCoordinateSpace(sc => this._draw(sc.context, sc.mediaSize))})}]; }
  attached(p){ this.p = p; } detached(){} updateAllViews(){} paneViews(){ return this._views; }
}
function scVisible(chart, n){ const r = chart.timeScale().getVisibleLogicalRange(); if (!r) return null;
  const a = Math.max(0, Math.floor(r.from)), b = Math.min(n - 1, Math.ceil(r.to)); return a <= b ? [a, b] : null; }
// 이평 서핑: 단기선(10)과 중기선(20) 사이를 칠함 — 단기선이 위면 초록, 아래면 빨강
function scSurf(chart, series, fast, slow, n){
  return new SCPrim((ctx) => {
    const vr = scVisible(chart, n); if (!vr) return; const ts = chart.timeScale();
    for (let i = Math.max(1, vr[0]); i <= Math.min(n - 1, vr[1] + 1); i++){
      const f0 = fast[i - 1], s0 = slow[i - 1], f1 = fast[i], s1 = slow[i];
      if (f0 == null || s0 == null || f1 == null || s1 == null) continue;
      const x0 = ts.logicalToCoordinate(i - 1), x1 = ts.logicalToCoordinate(i);
      const yf0 = series.priceToCoordinate(f0), ys0 = series.priceToCoordinate(s0), yf1 = series.priceToCoordinate(f1), ys1 = series.priceToCoordinate(s1);
      if ([x0, x1, yf0, ys0, yf1, ys1].some(v => v == null)) continue;
      const d0 = f0 - s0, d1 = f1 - s1;
      const poly = (pts, up) => { ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
        ctx.fillStyle = up ? "rgba(46,160,90,.18)" : "rgba(224,56,62,.14)"; ctx.fill(); };
      if (d0 * d1 >= 0) poly([[x0, yf0], [x1, yf1], [x1, ys1], [x0, ys0]], (d0 + d1) >= 0);
      else { const t = d0 / (d0 - d1), xm = x0 + (x1 - x0) * t, ym = yf0 + (yf1 - yf0) * t;
        poly([[x0, yf0], [xm, ym], [x0, ys0]], d0 > 0); poly([[xm, ym], [x1, yf1], [x1, ys1]], d1 > 0); }
    }
  }, "bottom");
}
// 매물대: 화면에 보이는 기간의 거래량을 가격 20구간에 나눠 왼쪽에 가로 막대로 (봉의 고저 범위에 고르게 배분)
const SC_VP_BINS = 20;
function scVP(chart, series, x, onInfo){
  const n = x.t.length;
  return new SCPrim((ctx, size) => {
    const vr = scVisible(chart, n); if (!vr) return;
    let lo = Infinity, hi = -Infinity;
    for (let i = vr[0]; i <= vr[1]; i++){ lo = Math.min(lo, x.l[i]); hi = Math.max(hi, x.h[i]); }
    if (!(hi > lo)) return;
    const B = SC_VP_BINS, w = (hi - lo) / B, bins = new Array(B).fill(0);
    for (let i = vr[0]; i <= vr[1]; i++){
      const a = x.l[i], b = x.h[i], v = x.v[i]; if (!v) continue;
      if (b <= a){ bins[Math.min(B - 1, Math.floor((a - lo) / w))] += v; continue; }
      const k0 = Math.max(0, Math.floor((a - lo) / w)), k1 = Math.min(B - 1, Math.floor((b - lo) / w));
      for (let k = k0; k <= k1; k++){ const e0 = lo + k * w, e1 = e0 + w; bins[k] += v * (Math.min(b, e1) - Math.max(a, e0)) / (b - a); }
    }
    const tot = bins.reduce((p, q) => p + q, 0); if (!tot) return;
    const poc = bins.indexOf(Math.max(...bins)), inVA = new Set([poc]);
    let acc = bins[poc], u = poc + 1, d = poc - 1;
    while (acc < tot * 0.7 && (u < B || d >= 0)){
      const bu = u < B ? bins[u] : -1, bd = d >= 0 ? bins[d] : -1;
      if (bu >= bd){ inVA.add(u); acc += bu; u++; } else { inVA.add(d); acc += bd; d--; }
    }
    const mx = bins[poc], W = Math.min(size.width * 0.24, 260);
    for (let k = 0; k < B; k++){
      const y0 = series.priceToCoordinate(lo + k * w), y1 = series.priceToCoordinate(lo + (k + 1) * w);
      if (y0 == null || y1 == null) continue;
      const top = Math.min(y0, y1) + 1, h = Math.max(1, Math.abs(y1 - y0) - 2);
      ctx.fillStyle = k === poc ? "rgba(240,145,58,.42)" : inVA.has(k) ? "rgba(110,122,145,.30)" : "rgba(110,122,145,.15)";
      ctx.fillRect(0, top, bins[k] / mx * W, h);
    }
    const va = [...inVA], vaLo = lo + Math.min(...va) * w, vaHi = lo + (Math.max(...va) + 1) * w, pocP = lo + (poc + 0.5) * w;
    onInfo && onInfo(pocP, vaLo, vaHi, vr[1] - vr[0] + 1);
  }, "bottom");
}
function scDraw(raw){
  const LW = window.LightweightCharts, el = $("#scchart");
  if (scRO){ scRO.disconnect(); scRO = null; }
  if (scChart){ scChart.remove(); scChart = null; }
  const day = scDecode(raw), x = SCST.tf === "w" ? scWeekly(day) : day, n = x.t.length;
  const up = cssv("var(--up)"), dn = cssv("var(--dn)"), sub = cssv("var(--sub)"), line = cssv("var(--line)"), ink = cssv("var(--ink)");
  const chart = LW.createChart(el, {autoSize: true, layout: {background: {color: "transparent"}, textColor: sub, fontSize: 11, panes: {separatorColor: line}},
    grid: {vertLines: {color: line + "80"}, horzLines: {color: line + "80"}}, rightPriceScale: {borderColor: line, mode: SCST.log ? 1 : 0},
    timeScale: {borderColor: line, rightOffset: 4, minBarSpacing: 1}, crosshair: {mode: 0},
    localization: {priceFormatter: v => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (+v.toFixed(2)).toLocaleString()}});
  scChart = chart;
  const cs = chart.addSeries(LW.CandlestickSeries, {upColor: up, downColor: dn, borderUpColor: up, borderDownColor: dn, wickUpColor: up, wickDownColor: dn, priceLineVisible: false});
  cs.setData(x.t.map((t, i) => ({time: t, open: x.o[i], high: x.h[i], low: x.l[i], close: x.c[i]})));
  const mas = SC_MA[SCST.tf].map(([p, col]) => { const a = scSMA(x.c, p), s = chart.addSeries(LW.LineSeries, {color: cssv(col), lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false});
    s.setData(x.t.map((t, i) => a[i] == null ? {time: t} : {time: t, value: a[i]})); return [p, cssv(col), a]; });
  if (SCST.surf && mas.length > 1) cs.attachPrimitive(scSurf(chart, cs, mas[0][2], mas[1][2], n));
  const pf = v => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (+v.toFixed(2)).toLocaleString();
  if (SCST.vp) cs.attachPrimitive(scVP(chart, cs, x, (p, a, b, nb) => { const el = $("#scvpi"), t = `매물대 (보이는 ${nb}봉 · 20구간) — 최다 거래 ${pf(p)} · 거래 70% 구간 ${pf(a)}~${pf(b)}`; if (el && el.textContent !== t) el.textContent = t; }));
  const vs = chart.addSeries(LW.HistogramSeries, {priceFormat: {type: "volume"}, priceLineVisible: false, lastValueVisible: false}, 1);
  vs.setData(x.t.map((t, i) => ({time: t, value: x.v[i], color: (i && x.c[i] < x.c[i - 1] ? dn : up) + "aa"})));
  const vma = scSMA(x.v, SC_VMA[SCST.tf]);
  const vl = chart.addSeries(LW.LineSeries, {color: ink, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false}, 1);
  vl.setData(x.t.map((t, i) => vma[i] == null ? {time: t} : {time: t, value: vma[i]}));
  // RS 라인 = 종가 ÷ 소속 시장 지수 (스탁이지와 같은 비율값 그대로)
  const rsv = x.c.map((c, i) => x.ix[i] ? c / x.ix[i] : null);
  const rsPrec = Math.max(...rsv.filter(v => v != null)) < 1 ? 3 : 2;
  const rl = chart.addSeries(LW.LineSeries, {color: "#7b4fd6", lineWidth: 2, priceLineVisible: false, lastValueVisible: true,
    priceFormat: {type: "price", precision: rsPrec, minMove: rsPrec === 3 ? 0.001 : 0.01}}, 2);
  rl.setData(x.t.map((t, i) => rsv[i] == null ? {time: t} : {time: t, value: rsv[i]}));
  const panes = chart.panes(); panes[0].setStretchFactor(6); panes[1].setStretchFactor(1.8); panes[2].setStretchFactor(1.8);
  const show = SCST.tf === "w" ? 104 : 250;   // 기본 화면: 주봉 2년, 일봉 1년
  chart.timeScale().setVisibleLogicalRange({from: Math.max(0, n - show), to: n + 3});
  const idx = {}; x.t.forEach((t, i) => idx[t] = i);
  const fmt = v => v == null ? "–" : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (+v.toFixed(2)).toLocaleString();
  const vfmt = v => v >= 1e8 ? (v / 1e8).toFixed(2) + "억" : v >= 1e4 ? Math.round(v / 1e4).toLocaleString() + "만" : Math.round(v).toLocaleString();
  const leg = i => {
    const ch = i > 0 ? x.c[i] / x.c[i - 1] - 1 : null;
    $("#scleg").innerHTML = `<span>${x.t[i]}</span><span>시 ${fmt(x.o[i])} 고 ${fmt(x.h[i])} 저 ${fmt(x.l[i])} 종 <b class="${cls(ch)}">${fmt(x.c[i])} ${ch == null ? "" : pct(ch, 2)}</b></span>`
      + mas.map(([p, col, a]) => `<span style="color:${col}">${p}${SCST.tf === "w" ? "주" : "일"} ${fmt(a[i])}</span>`).join("");
    $("#scvlab").textContent = `거래량 ${vfmt(x.v[i])} · ${SC_VMA[SCST.tf]}${SCST.tf === "w" ? "주" : "일"} 평균 ${vma[i] == null ? "–" : vfmt(vma[i])}${vma[i] ? ` (${(x.v[i] / vma[i]).toFixed(1)}배)` : ""}`;
    $("#scrlab").textContent = `RS 라인 (종가 ÷ ${raw.market === "KOSDAQ" ? "코스닥" : "코스피"}) ${rsv[i] == null ? "–" : rsv[i].toFixed(rsPrec)}`;
  };
  const place = () => { if (!$("#scvlab") || scChart !== chart) return; const h = panes.map(p => p.getHeight()); $("#scvpi").style.top = (h[0] - 18) + "px"; $("#scvlab").style.top = (h[0] + 6) + "px"; $("#scrlab").style.top = (h[0] + h[1] + 10) + "px"; };
  leg(n - 1); requestAnimationFrame(place);
  chart.subscribeCrosshairMove(p => { const i = p && p.time != null ? idx[p.time] : undefined; leg(i == null ? n - 1 : i); });
  scRO = new ResizeObserver(() => requestAnimationFrame(place)); scRO.observe(el);
  $("#scnote").textContent = SCST.tf === "w" ? "주봉 · 10주(빨강)·30주(파랑)·40주 이동평균 (10·30주선 사이 색칠) · 거래량 10주 평균 · RS 라인" : "일봉 · 10·20·50·200일 이동평균 (10·20일선 사이: 초록 = 10일선 위, 빨강 = 아래) · 거래량 50일 평균 · RS 라인 · 드래그·휠로 이동/확대";
}

function route(){
  const h = (location.hash || "#kr").slice(1), [tab, sec] = h.split("/");
  const mode = ["rs", "nh", "cs", "sc"].includes(tab) ? tab : "chart";
  miniCleanup();
  if (mode !== "sc" && scChart){ if (scRO){ scRO.disconnect(); scRO = null; } scChart.remove(); scChart = null; }
  $("#tabs").hidden = mode === "rs" || mode === "cs" || mode === "sc"; $("#tf").hidden = mode !== "chart";
  $("#ptitle").textContent = {rs: "상대강도", nh: "신고가", cs: "차트 셋업", sc: "종목차트"}[mode] || "차트북";
  $("#asof").textContent = D && D.generated ? `업데이트 ${D.generated}` : "";
  if (mode === "rs"){ renderRS(sec ? decodeURIComponent(sec) : null); window.scrollTo(0, 0); return; }
  if (mode === "cs"){ renderCS(sec || null); window.scrollTo(0, 0); return; }
  if (mode === "sc"){ renderSC(sec || null); window.scrollTo(0, 0); return; }
  if (mode === "nh"){
    const k = sec ? "nh/" + sec : "nh";
    $("#tabs").innerHTML = NH_TABS.map(([kk, l]) => `<button class="tab ${kk===k?"on":""}" data-k="${kk}">${l}</button>`).join("");
    renderNH(sec || "today"); window.scrollTo(0, 0); return;
  }
  const t = TABS.find(x => x[0] === tab) ? tab : "kr";
  $("#tabs").innerHTML = TABS.map(([k, , l]) => `<button class="tab ${k===t?"on":""}" data-k="${k}">${l}</button>`).join("");
  if (t === "kr" && sec) renderSector(decodeURIComponent(sec)); else renderGroup(t);
  window.scrollTo(0, 0);
}
$("#tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) location.hash = "#" + b.dataset.k; };
$("#tf").innerHTML = TF.map(([k, l]) => `<button data-k="${k}" class="${k===gTF?"on":""}">${l}봉</button>`).join("");
$("#tf").onclick = e => {
