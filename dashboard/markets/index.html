<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Charts</title>
<style>
:root{
  --bg:#eef0f5; --card:#fff; --ink:#1b2236; --sub:#6b7280; --line:#e5e7eb;
  --px:#1f2a44; --ma:#f0913a; --up:#e0383e; --dn:#2f6fdf; --flat:#9ca3af;
  --up-bg:#fdecec; --dn-bg:#e9f0fd; --hl:#f0913a; --chip:#f3f4f6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131b; --card:#171c27; --ink:#e7eaf0; --sub:#9aa3b2; --line:#2a3140;
    --px:#d5dbe7; --ma:#f0913a; --up:#ff5a5f; --dn:#5b8ff9; --flat:#6b7280;
    --up-bg:#3a1e22; --dn-bg:#1c2940; --chip:#222837;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131b; --card:#171c27; --ink:#e7eaf0; --sub:#9aa3b2; --line:#2a3140;
  --px:#d5dbe7; --ma:#f0913a; --up:#ff5a5f; --dn:#5b8ff9; --flat:#6b7280;
  --up-bg:#3a1e22; --dn-bg:#1c2940; --chip:#222837;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg)}
.bar{max-width:1500px;margin:0 auto;padding:0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bar2{max-width:1500px;margin:0 auto;padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar2[hidden]{display:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs{background:var(--chip);border-radius:9px;padding:2px}
.tab{border:0;background:none;color:var(--sub);font:inherit;font-size:13px;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tf{margin-left:auto;display:flex;gap:4px}
.tf button{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer}
.tf button.on{color:var(--ink);border-color:var(--ink)}
main{max-width:1500px;margin:0 auto;padding:12px 16px 40px}
.note{color:var(--sub);font-size:12px;margin:2px 0 10px}
.note b{color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.tools select,.tools input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.back{border:0;background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer}
h2{font-size:18px;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.sep{grid-column:1/-1;height:0}
.card{background:var(--card);border-radius:12px;padding:10px 12px 8px;border:1.5px solid transparent;cursor:pointer;min-width:0}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card.hl{border-color:var(--hl)}
.top{display:flex;align-items:baseline;gap:6px;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.tk{color:var(--sub);font-size:11px;white-space:nowrap}
.chg{margin-left:auto;font-weight:700;white-space:nowrap}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--flat)}
svg.ch{display:block;width:100%;height:auto;margin:4px 0 2px}
svg.ch text{font-size:9px;fill:var(--sub)}
svg.ch .lab{font-size:10.5px;font-weight:700;fill:var(--ink)}
.bot{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.bd{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid transparent;cursor:pointer;background:var(--chip);color:var(--flat)}
.bd.u{background:var(--up-bg);color:var(--up)} .bd.d{background:var(--dn-bg);color:var(--dn)}
.bd.on{border-color:currentColor}
.ft{margin-left:auto;color:var(--sub);font-size:11px;white-space:nowrap}
.foot{color:var(--sub);font-size:12px;margin-top:14px}
.empty{color:var(--sub);padding:30px 0}
.modes{display:flex;gap:0;overflow-x:auto}
.mode{border:0;border-bottom:3px solid transparent;background:none;color:#8494a6;font:inherit;font-size:13px;font-weight:700;padding:12px 17px 11px;cursor:pointer;white-space:nowrap}
.mode:hover{color:#1f675c}
.mode.on{color:#1f675c;border-bottom-color:#39b594}
:root[data-theme="dark"] .mode.on{color:#4fdbb0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mode.on,:root:not([data-theme="light"]) .mode:hover{color:#4fdbb0}}
.asof{margin-left:auto;color:var(--sub);font-size:12px}
.seg{display:inline-flex;gap:2px;background:var(--chip);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--sub);font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rrgwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:900px){.rrgwrap{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:12px;padding:12px;min-width:0}
svg.rrg{display:block;width:100%;height:auto}
svg.rrg text{font-size:11px;fill:var(--sub)}
svg.rrg .ql{font-size:13px;font-weight:800;opacity:.55}
svg.rrg .sl{font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px}
svg.rrg g.s{cursor:pointer}
svg.rrg g.s path,svg.rrg g.s circle.t{pointer-events:none}
svg.rrg g.s.dim{opacity:.18}
svg.rrg g.s .tl{display:none}
svg.rrg g.s:hover .tl,svg.rrg g.s.sel .tl,svg.rrg.all g.s .tl{display:inline}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:12px;color:var(--sub);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.l,table.t td.l{text-align:left}
table.t td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr.sel td{background:var(--chip)}
table.t tr.idx td{background:var(--chip);font-weight:600}
table.t tbody tr:hover td{background:var(--chip)}
.q{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff}
.q-주도{background:#e0383e}.q-약화{background:#f0913a}.q-소외{background:#2f6fdf}.q-개선{background:#22a06b}
.strong{font-weight:800;color:var(--up)}
.tw{overflow-x:auto;background:var(--card);border-radius:12px;padding:4px 8px}
.chipx{display:inline-flex;gap:6px;align-items:center;background:var(--ink);color:var(--card);font-size:12px;font-weight:700;padding:3px 10px;border-radius:14px;cursor:pointer}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:6px 16px;border-radius:8px;cursor:pointer}
a.sn{color:inherit;text-decoration:none;font-weight:700}
a.sn:hover{text-decoration:underline}
.code{color:var(--sub);font-size:11px;margin-left:4px}
.mh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:2px 2px 8px}
.lnk{margin-left:auto;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.madd select{width:100%;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.mlist{max-height:470px;overflow-y:auto}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.mrow.mhd{cursor:default;color:var(--sub);font-size:12px;margin-top:8px}
.mrow:not(.mhd):hover,.mrow.sel{background:var(--chip)}
.qd{width:10px;height:10px;border-radius:50%;flex:none}
.mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mc{width:58px;text-align:right;white-space:nowrap}
.mx{border:0;background:none;color:var(--sub);cursor:pointer;font-size:12px;padding:2px 4px}
.mx:hover{color:var(--up)}
.quads{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:flex-start}
.qcol{background:var(--card);border-radius:12px;padding:8px 12px;min-width:150px;flex-basis:0}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.qitems{display:flex;flex-wrap:wrap;gap:6px}
.qi{display:inline-flex;gap:6px;align-items:baseline;background:var(--chip);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent}
.qi span{font-size:11px;font-weight:600}
.qi.sel{border-color:var(--ink)}
.cform{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;display:grid;gap:6px}
.cform input,.cform textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:100%}
.cform textarea{min-height:70px;resize:vertical}
.cbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.del{color:var(--up)}
.cmsg{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <div class="bar"><nav class="modes" id="modes" aria-label="증시데이터 화면"></nav><span class="asof" id="asof"></span></div>
  <div class="bar2" id="bar2"><nav class="tabs" id="tabs" aria-label="차트북 그룹"></nav><div class="tf" id="tf" title="모든 카드의 봉 단위"></div></div>
</header>
<main id="main"><div class="empty">데이터를 불러오는 중…</div></main>

<script src="data/overview.js"></script>
<script>
"use strict";
const D = window.DASH_OVERVIEW;
const TABS = [["kr","KR_SECTOR","한국 업종"],["us","US_SECTOR_ETF","미국 지수·섹터"],["macro","MACRO","상품·통화·금리"]];
const TF = [["d","일"],["w","주"],["m","월"]];
const EPOCH = Date.UTC(2000,0,1), DAY = 864e5;
const BENCH = {KS11:"코스피", SPY:"SPY"};
let gTF = "d";
const cardTF = new Map();          // 카드별로 바꾼 봉 단위
const $ = (s, el=document) => el.querySelector(s);

// ---------------------------------------------------------------- 포맷
const sign = v => v > 0 ? "+" : "";
const cls = v => v == null ? "fl" : v > 0.00005 ? "up" : v < -0.00005 ? "dn" : "fl";
const pct = (v, nd=1) => v == null ? "–" : sign(v) + (v*100).toFixed(nd) + "%";
const pp = v => v == null ? "–" : sign(v) + Math.round(v*100) + "%p";
const pct0 = v => v == null ? "–" : sign(v) + Math.round(v*100) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function footer(c, keys){
  const f = {
    ret_1m: () => `1개월 ${pct0(c.ret_1m)}`,
    rel_3m: () => `3개월 상대 ${pp(c.rel_3m)}`,
    dd_52w: () => `52주 고점 대비 ${pct0(c.dd_52w)}`,
    rs:     () => `RS ${c.rs ?? "–"}`,
  };
  return keys.map(k => f[k] ? f[k]() : "").filter(Boolean).join(" · ");
}

// ---------------------------------------------------------------- 차트
function decode(s){
  const t = new Array(s.t.length); let d = 0;
  for (let i = 0; i < s.t.length; i++){ d += s.t[i]; t[i] = d; }
  return t;
}
function sma(c, n){
  const out = new Array(c.length).fill(null); let sum = 0;
  for (let i = 0; i < c.length; i++){
    sum += c[i]; if (i >= n) sum -= c[i-n];
    if (i >= n-1) out[i] = sum / n;
  }
  return out;
}
function chartSVG(card, tf){
  const s = card.series && card.series[tf];
  const W = 260, H = 92, L = 2, R = 46, T = 6, B = 16;
  if (!s || !s.c || s.c.length < 2) return `<svg class="ch" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle">데이터 없음</text></svg>`;
  const days = decode(s), ma = sma(s.c, D.ma[tf]);
  const c = s.c.slice(s.k), m = ma.slice(s.k), t = days.slice(s.k);
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < c.length; i++){
    lo = Math.min(lo, c[i], m[i] ?? Infinity); hi = Math.max(hi, c[i], m[i] ?? -Infinity);
  }
  if (hi === lo){ hi += 1; lo -= 1; }
  const x = i => L + (W - L - R) * i / (c.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const path = arr => { let p = "", pen = false;
    arr.forEach((v, i) => { if (v == null){ pen = false; return; }
      p += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; }); return p; };
  // x축 눈금: 일봉 1·7월, 주·월봉 1월
  let ticks = "", pm = -1;
  for (let i = 0; i < t.length; i++){
    const dt = new Date(EPOCH + t[i]*DAY), mo = dt.getUTCMonth();
    if (pm !== -1 && mo !== pm && (tf === "d" ? (mo === 0 || mo === 6) : mo === 0)){
      const lab = String(dt.getUTCFullYear()).slice(2) + (tf === "d" ? "." + String(mo+1).padStart(2,"0") : "");
      ticks += `<text x="${x(i).toFixed(1)}" y="${H-3}" text-anchor="middle">${lab}</text>`;
    }
    pm = mo;
  }
  const cum = c[c.length-1] / c[0] - 1, ly = y(c[c.length-1]);
  return `<svg class="ch" viewBox="0 0 ${W} ${H}">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
    <path d="${path(m)}" fill="none" stroke="var(--ma)" stroke-width="1.3"/>
    <path d="${path(c)}" fill="none" stroke="var(--px)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="${x(c.length-1)}" cy="${ly}" r="2.4" fill="var(--px)"/>
    <text class="lab" x="${W-R+5}" y="${Math.max(10, Math.min(H-B, ly+4))}">${pct0(cum)}</text>
    ${ticks}</svg>`;
}

// ---------------------------------------------------------------- 카드
function cardHTML(c, keys, sub){
  const tf = cardTF.get(c.id) || gTF;
  const b = c.badges || {};
  const badges = TF.map(([k, lab]) => {
    const v = b[k], st = v === 1 ? "u" : v === 0 ? "d" : "";
    return `<span class="bd ${st} ${k === tf ? "on" : ""}" data-tf="${k}" title="${lab}봉 ${k==="d"?(D.badge_ma||{d:50}).d+"일":k==="w"?"30주":"10개월"}선 ${v===1?"위":v===0?"아래":"–"}">${lab}${v===1?"▲":v===0?"▼":"·"}</span>`;
  }).join("");
  return `<div class="card ${c.changed ? "hl" : ""}" data-id="${esc(c.id)}">
    <div class="top"><span class="nm">${esc(c.name)}</span><span class="tk">${esc(sub)}</span>
      <span class="chg ${cls(c.chg_1d)}">${pct(c.chg_1d)}</span></div>
    <div class="cv" data-tf="${tf}"></div>
    <div class="bot">${badges}<span class="ft">${footer(c, keys)}</span></div></div>`;
}

const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; io.unobserve(e.target); drawCard(e.target);
}), {rootMargin: "300px"});
let CARDS = new Map();
function drawCard(el){
  const c = CARDS.get(el.dataset.id); if (!c) return;
  const tf = cardTF.get(c.id) || gTF;
  $(".cv", el).innerHTML = chartSVG(c, tf);
  el.querySelectorAll(".bd").forEach(b => b.classList.toggle("on", b.dataset.tf === tf));
}
function mountGrid(root, list){
  CARDS = new Map(list.map(c => [c.id, c]));
  root.querySelectorAll(".card").forEach(el => io.observe(el));
  root.onclick = e => {
    const card = e.target.closest(".card"); if (!card) return;
    const c = CARDS.get(card.dataset.id), bd = e.target.closest(".bd");
    if (bd){ cardTF.set(c.id, bd.dataset.tf); drawCard(card); return; }
    if (c.sector){ location.hash = "#kr/" + c.sector; return; }
    if (c.link) window.open(c.link, "_blank", "noopener");
  };
}

// ---------------------------------------------------------------- 화면
function sortCards(list, key, dir=-1){
  return list.slice().sort((a, b) => {
    const va = a[key], vb = b[key];
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return dir * (va - vb);
  });
}
function renderGroup(tab){
  const [, gid] = TABS.find(t => t[0] === tab);
  const g = D.groups.find(x => x.id === gid);
  if (!g){ $("#main").innerHTML = `<div class="empty">그룹 없음</div>`; return; }
  const pinned = g.cards.filter(c => c.pinned).sort((a, b) => a.order - b.order);
  let rest = g.cards.filter(c => !c.pinned);
  rest = g.sort === "rel_3m_desc" ? sortCards(rest, "rel_3m") : rest.sort((a, b) => a.order - b.order);
  const bench = BENCH[g.benchmark] || g.benchmark;
  const n = g.cards.filter(c => c.changed).length;
  const note = (g.sort === "rel_3m_desc" ? `정렬: 3개월 상대수익률(${esc(bench)} 대비) · ` : "자산군 순서 · ")
    + (gid === "MACRO" ? "환율은 달러 기준(오르면 원·엔 약세), 금리는 수익률(%) 자체의 등락 · " : "")
    + `<b>주황 테두리</b> = 오늘 일·주·월 뱃지 중 하나가 바뀐 카드(${n}개) · 뱃지: 일 50일선 / 주 30주선 / 월 10개월선 위▲·아래▼ · 주황선: 일봉 ${D.ma.d}일선`
    + ` · 데이터 ${g.asof || "–"} 기준`;
  const sub = c => c.sector ? `${c.count ?? ""}종목` : (c.ticker || "");
  const html = pinned.map(c => cardHTML(c, g.pinned_footer.length ? g.pinned_footer : g.footer, sub(c))).join("")
    + rest.map(c => cardHTML(c, g.footer, sub(c))).join("");
  $("#main").innerHTML = `<div class="note">${note}</div><div class="grid" id="grid">${html}</div>`;
  mountGrid($("#grid"), g.cards);
}

const SECTOR_SORT = [["rel_3m","3개월 상대"],["ret_1m","1개월"],["chg_1d","당일"],["rs","RS"],["mcap","시가총액"],["dd_52w","52주 고점 대비"]];
let secSort = "rel_3m", secQuery = "";
function loadScript(src){
  return new Promise((ok, no) => { const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
}
async function renderSector(sec){
  const g = D.groups.find(x => x.id === "KR_SECTOR");
  const sc = g && g.cards.find(c => c.sector === sec);
  if (!(window.DASH_SECTOR && window.DASH_SECTOR[sec])){
    $("#main").innerHTML = `<div class="empty">불러오는 중…</div>`;
    try { await loadScript(`data/kr_${encodeURIComponent(sec)}.js`); }
    catch { $("#main").innerHTML = `<div class="empty">섹터 데이터를 찾을 수 없습니다.</div>`; return; }
  }
  const S = window.DASH_SECTOR[sec];
  const draw = () => {
    const q = secQuery.trim().toLowerCase();
    const list = sortCards(S.cards.filter(c => !q || c.name.toLowerCase().includes(q) || c.id.includes(q)), secSort);
    const nChg = S.cards.filter(c => c.changed).length;
    $("#grid").innerHTML = list.map(c => cardHTML(c, ["ret_1m","rel_3m","rs"], c.id)).join("") ||
      `<div class="empty">검색 결과 없음</div>`;
    $("#cnt").textContent = `${list.length}/${S.cards.length}종목 · 바뀐 카드 ${nChg}개`;
    mountGrid($("#grid"), S.cards);
  };
  $("#main").innerHTML = `
    <div class="tools"><button class="back" id="back">← 한국 업종</button>

async function ensurePX(){
  if (PX) return PX;
  if (!window.DASH_RS_PX) await loadScript("data/rs_px.js");
  const D0 = window.DASH_RS_PX, T = D0.dates.length;
  const pos = Object.fromEntries(D0.codes.map((c, i) => [c, i]));
  const level = r => {            // 일간 수익률(bp) → 마지막 날 = 1 인 상대 가격, 상장 전은 null
    const fi = r.findIndex(v => v != null), lev = new Array(T).fill(null);
    if (fi < 0) return lev;
    lev[T - 1] = 1;
    for (let t = T - 1; t >= Math.max(1, fi); t--) lev[t - 1] = lev[t] / (1 + (r[t] ?? 0) / 1e4);
    return lev;
  };
  const cum = r => { const o = [1]; for (let t = 1; t < T; t++) o.push(o[t - 1] * (1 + (r[t] ?? 0) / 1e4)); return o; };
  PX = {T, dates: D0.dates, pos, level, levCache: {}, bench: Object.fromEntries(Object.entries(D0.bench).map(([k, r]) => [k, cum(r)]))};
  return PX;
}
function basketIndex(codes){
  const D0 = window.DASH_RS_PX, T = PX.T, mem = codes.map(c => PX.pos[c]).filter(i => i != null);
  mem.forEach(i => { if (!PX.levCache[i]) PX.levCache[i] = PX.level(D0.r[i]); });
  const idx = [1];
  for (let t = 1; t < T; t++){
    let num = 0, den = 0;
    for (const i of mem){ const r = D0.r[i][t], l = PX.levCache[i][t - 1];
      if (r == null || l == null) continue; const w = D0.mcap[i] * l; num += w * r / 1e4; den += w; }
    idx.push(idx[t - 1] * (1 + (den ? num / den : 0)));
  }
  return idx;
}
function rrgPointsJS(sec, bench, weeks){
  const p0 = RS.rrg.periods[weeks], v = sec.map((x, i) => x / bench[i]), n = v.length;
  const l = Math.min(p0.days, n - 1), f = Math.max(15, Math.round(l / 2)), p = Math.max(5, Math.round(l / p0.points));
  const end = n - 1, start = end - l, idx = [...new Set(Array.from({length: p0.points}, (_, k) => Math.round(start + (end - start) * k / (p0.points - 1))))];
  return idx.map(i => { const w = v.slice(Math.max(0, i - f), i + 1), avg = w.reduce((a, b) => a + b, 0) / w.length;
    return [Math.round(10000 * v[i] / avg) / 100, Math.round(10000 * v[i] / v[Math.max(0, i - p)]) / 100]; });
}
function registerCustom(c){
  const id = "CU:" + c.name, codes = c.codes.filter(x => PX.pos[x] != null);
  const ix = basketIndex(codes), T = ix.length, chg = k => T > k ? Math.round(10000 * (ix[T - 1] / ix[T - 1 - k] - 1)) / 100 : null;
  SEC[id] = {id, name: c.name, level: "C", parent: null, count: codes.length, codes, chg_1w: chg(5), chg_4w: chg(20)};
  Object.keys(RS.rrg.benchmarks).forEach(b => {
    RS.rrg.rrg[b][id] = Object.fromEntries(RS.rrg.windows.map(w => [String(w), codes.length ? rrgPointsJS(ix, PX.bench[b], String(w)) : []]));
  });
  return id;
}
function resolveStocks(text){
  const byName = {}, byLower = {};
  STOCKS.forEach(s => { byName[s.name] = s.code; byLower[s.name.toLowerCase().replace(/\s+/g, "")] = s.code; });
  const ok = [], miss = [];
  text.split(/[,\n;\t]+/).map(t => t.trim()).filter(Boolean).forEach(t => {
    const c = /^A?\d{6}$/.test(t) ? t.replace(/^A/, "") : (byName[t] || byLower[t.toLowerCase().replace(/\s+/g, "")]);
    if (c && PX.pos[c] != null){ if (!ok.includes(c)) ok.push(c); } else miss.push(t);
  });
  return {ok, miss};
}

function rrgData(){
  const T = RS.rrg.rrg[RSST.bench];
  return ACTIVE.map(id => SEC[id]).filter(Boolean).map(s => {
    const tail = (T[s.id] || {})[RSST.n] || [];
    const last = tail[tail.length - 1] || [null, null];
    return {...s, tail, ratio: last[0], mom: last[1], q: last[0] == null ? "-" : quad(last[0], last[1])};
  }).filter(s => s.ratio != null);
}

function drawRRG(){
  const data = rrgData(), W = 600, H = 560, L = 44, Rm = 16, T = 16, B = 36;
  // 축 범위: 현재 점 + 보이는 꼬리(선택한 섹터, 또는 '꼬리 모두 보기')만 기준으로
  let span = 0.5;
  data.forEach(s => (RSST.allTails || s.id === RSST.sector ? s.tail : [[s.ratio, s.mom]])
    .forEach(([a, m]) => { span = Math.max(span, Math.abs(a - 100), Math.abs(m - 100)); }));
  const step = [0.5, 1, 2, 5, 10, 20, 50].find(v => (span * 1.1) / v <= 4) || 100;
  span = Math.ceil((span * 1.1) / step) * step;
  const x = v => L + (W - L - Rm) * (v - (100 - span)) / (2 * span);
  const y = v => T + (H - T - B) * (1 - (v - (100 - span)) / (2 * span));
  const cx = x(100), cy = y(100);
  let grid = "";
  for (let v = 100 - span; v <= 100 + span + 1e-9; v += step){
    const vv = Math.round(v * 10) / 10;
    grid += `<line x1="${x(vv)}" x2="${x(vv)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-width="${vv===100?1.5:.6}"/>`
      + `<text x="${x(vv)}" y="${H-B+14}" text-anchor="middle">${vv}</text>`
      + `<line x1="${L}" x2="${W-Rm}" y1="${y(vv)}" y2="${y(vv)}" stroke="var(--line)" stroke-width="${vv===100?1.5:.6}"/>`
      + `<text x="${L-6}" y="${y(vv)+4}" text-anchor="end">${vv}</text>`;
  }
  const tint = (q, x0, y0, x1, y1) => `<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${QCOL[q]}" opacity=".07"/>`;
  const quads = tint("개선", L, T, cx, cy) + tint("주도", cx, T, W-Rm, cy) + tint("소외", L, cy, cx, H-B) + tint("약화", cx, cy, W-Rm, H-B)
    + `<text class="ql" x="${L+8}" y="${T+18}" fill="${QCOL["개선"]}">개선</text>`
    + `<text class="ql" x="${W-Rm-8}" y="${T+18}" text-anchor="end" fill="${QCOL["주도"]}">주도</text>`
    + `<text class="ql" x="${L+8}" y="${H-B-8}" fill="${QCOL["소외"]}">소외</text>`
    + `<text class="ql" x="${W-Rm-8}" y="${H-B-8}" text-anchor="end" fill="${QCOL["약화"]}">약화</text>`;
  const sel = RSST.sector;
  const pts = data.map(s => {
    const c = QCOL[s.q], P = s.tail.map(([a, m]) => [x(a), y(m)]);
    const path = P.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
    const dots = P.slice(0, -1).map((p, i) => `<circle class="t" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(2.4 + 1.6 * i / P.length).toFixed(1)}" fill="${c}" opacity="${(0.35 + 0.5 * i / P.length).toFixed(2)}"/>`).join("");
    const [hx, hy] = P[P.length - 1];
    const tip = `${s.name} · ${s.q}\nRS-Ratio ${s.ratio.toFixed(2)} · RS-Momentum ${s.mom.toFixed(2)}\n1주 ${s.chg_1w == null ? "–" : (s.chg_1w > 0 ? "+" : "") + s.chg_1w.toFixed(1) + "%"} · ${s.count}종목`;
    return `<g class="s ${sel && sel !== s.id ? "dim" : ""} ${sel === s.id ? "sel" : ""}" data-id="${s.id}"><title>${esc(tip)}</title>
      <g class="tl"><path d="${path}" fill="none" stroke="${c}" stroke-width="1.6" opacity=".6"/>${dots}</g>
      <circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="${sel === s.id ? 7 : 5.5}" fill="${c}" stroke="var(--card)" stroke-width="1.5"/>
      <text class="sl" x="${(hx + 8).toFixed(1)}" y="${(hy + 4).toFixed(1)}">${esc(s.name)}</text></g>`;
  }).join("");
  $("#rrg").innerHTML = `<svg class="rrg ${RSST.allTails ? "all" : ""}" viewBox="0 0 ${W} ${H}">${quads}${grid}
    <text x="${(L + W - Rm) / 2}" y="${H-4}" text-anchor="middle">RS-Ratio →</text>
    <text x="12" y="${(T + H - B) / 2}" text-anchor="middle" transform="rotate(-90 12 ${(T + H - B) / 2})">RS-Momentum →</text>
    ${pts}</svg>`;
  $("#rrg").onclick = e => { const g = e.target.closest("g.s"); if (g) setSector(g.dataset.id); };
}

    const name = $("#cname").value.trim().replace(/[<>]/g, ""), msg = $("#cmsg");
    if (!name){ msg.textContent = "이름을 입력하세요"; return; }
    if (CUSTOM.some(x => x.name === name && x !== c)){ msg.textContent = "같은 이름의 섹터가 있어요"; return; }
    msg.textContent = "계산 중…";
    try { await ensurePX(); } catch { msg.textContent = "data/rs_px.js 를 불러오지 못했어요"; return; }
    const {ok, miss} = resolveStocks($("#ccodes").value);
    if (!ok.length){ msg.textContent = "찾은 종목이 없어요" + (miss.length ? ` (못 찾음: ${miss.join(", ")})` : ""); return; }
    if (c){ const old = "CU:" + c.name; delete SEC[old]; ACTIVE = ACTIVE.map(x => x === old ? "CU:" + name : x); if (RSST.sector === old) RSST.sector = "CU:" + name; c.name = name; c.codes = ok; }
    else CUSTOM.push({name, codes: ok});
    saveCustom();
    const id = registerCustom(c || CUSTOM[CUSTOM.length - 1]);
    if (!ACTIVE.includes(id)) ACTIVE.push(id); saveActive();
    EDIT = miss.length ? name : null;
    drawAll();
    if (miss.length) $("#cmsg").textContent = `${ok.length}종목 저장 · 못 찾음: ${miss.join(", ")}`;
  };
}

function drawQuads(){
  const data = rrgData();
  const col = q => data.filter(s => s.q === q).sort((a, b) => (b.ratio + b.mom) - (a.ratio + a.mom));
  $("#quads").innerHTML = ["주도","개선","약화","소외"].map(q => { const l = col(q);
    return `<div class="qcol" style="flex-grow:${l.length + 1}"><div class="qh"><span class="q q-${q}">${q}</span><span class="note" style="margin:0">${l.length}</span></div>
      <div class="qitems">${l.map(s => `<span class="qi ${RSST.sector === s.id ? "sel" : ""}" data-id="${esc(s.id)}">${esc(secLabel(s))}
        <span class="${cls((s.chg_1w ?? 0) / 100)}">${s.chg_1w == null ? "" : pct(s.chg_1w / 100)}</span></span>`).join("") || `<span class="note" style="margin:0">없음</span>`}</div></div>`; }).join("");
  $("#quads").onclick = e => { const i = e.target.closest(".qi"); if (i) setSector(i.dataset.id); };
}

function drawFilters(){
  $("#rsf").innerHTML = `
    ${RSST.sector ? `<span class="chipx" id="secx">${esc(secLabel(SEC[RSST.sector]))} ✕</span>` : `<span class="note" style="margin:0">전체 섹터</span>`}
    <select id="fm"><option value="">전체 시장</option><option ${RSST.market==="KOSPI"?"selected":""}>KOSPI</option><option ${RSST.market==="KOSDAQ"?"selected":""}>KOSDAQ</option></select>
    <select id="fc">${CAPS.map(([v, l]) => `<option value="${v}" ${v===RSST.cap?"selected":""}>${l}</option>`).join("")}</select>
    <label class="note" style="margin:0"><input type="checkbox" id="fmtt" ${RSST.mtt?"checked":""}> MTT 충족만</label>
    <input id="fq" placeholder="종목명·코드" size="12" value="${esc(RSST.q)}">
    <span class="note" style="margin:0" id="fcnt"></span>`;
  const sx = $("#secx"); if (sx) sx.onclick = () => setSector(RSST.sector);
  $("#fm").onchange = e => { RSST.market = e.target.value; RSST.limit = 100; drawStocks(); };
  $("#fc").onchange = e => { RSST.cap = +e.target.value; RSST.limit = 100; drawStocks(); };
  $("#fmtt").onchange = e => { RSST.mtt = e.target.checked; RSST.limit = 100; drawStocks(); };
  $("#fq").oninput = e => { RSST.q = e.target.value; RSST.limit = 100; drawStocks(); };
}

function drawStocks(){
  const q = RSST.q.trim().toLowerCase();
  const S = RSST.sector ? SEC[RSST.sector] : null;
  let list = STOCKS.filter(s => (!S || (S.level === "L" ? s.sector === S.name : S.level === "C" ? S.codes.includes(s.code) : s.sub === S.name)) && (!RSST.market || s.market === RSST.market)
    && (s.mcap ?? 0) >= RSST.cap && (!RSST.mtt || s.mtt) && (!q || s.name.toLowerCase().includes(q) || s.code.includes(q)));
  const k = RSST.sort, d = RSST.dir;
  const val = s => k === "sector" ? (s.sector || "") + (s.sub || "") : s[k];
  list.sort((a, b) => { const va = val(a), vb = val(b);
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return typeof va === "string" ? d * va.localeCompare(vb) : d * (va - vb); });
  $("#fcnt").textContent = `${list.length.toLocaleString()}개 종목`;
  const rsCell = v => v == null ? "–" : (v >= 80 ? `<span class="strong">${v}</span>` : v);
  const capFmt = v => v == null ? "–" : v >= 10000 ? (v / 10000).toFixed(1) + "조" : v.toLocaleString() + "억";
  const idx = RS.stocks.indices.map(i => `<tr class="idx"><td class="l">지수</td><td class="l">${esc(i.name)}</td><td class="l">-</td>
    <td>${i.close.toLocaleString()}</td><td class="${cls((i.chg_1d ?? 0) / 100)}">${i.chg_1d == null ? "–" : pct(i.chg_1d / 100, 2)}</td>
    <td>${rsCell(i.rs)}</td><td>${i.rs_1m ?? "–"}</td><td>${i.rs_3m ?? "–"}</td><td>${i.rs_6m ?? "–"}</td><td>${i.rs_12m ?? "–"}</td><td>-</td><td>-</td></tr>`).join("");
  const rows = list.slice(0, RSST.limit).map(s => `<tr>
    <td class="l">${esc(s.sector || "미분류")}${s.sub ? `<span class="code">${esc(s.sub)}</span>` : ""}</td>
    <td class="l"><a class="sn" href="https://m.stock.naver.com/domestic/stock/${s.code}/total" target="_blank" rel="noopener">${esc(s.name)}</a><span class="code">${s.code}</span></td>
    <td class="l">${s.market === "KOSPI" ? "코스피" : s.market === "KOSDAQ" ? "코스닥" : esc(s.market || "")}</td>
    <td>${s.close == null ? "–" : s.close.toLocaleString()}</td><td class="${cls((s.chg_1d ?? 0) / 100)}">${s.chg_1d == null ? "–" : pct(s.chg_1d / 100, 2)}</td>
    <td>${rsCell(s.rs)}</td><td>${s.rs_1m ?? "–"}</td><td>${s.rs_3m ?? "–"}</td><td>${s.rs_6m ?? "–"}</td><td>${s.rs_12m ?? "–"}</td>
    <td>${s.mtt ? "✓" : ""}</td><td>${capFmt(s.mcap)}</td></tr>`).join("");
  $("#stk").innerHTML = `<thead><tr>${COLS.map(([c, l, a]) => `<th class="${a}" data-k="${c}">${l}${RSST.sort === c ? (RSST.dir < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>
    <tbody>${RSST.sector ? "" : idx}${rows}</tbody>`;
  $("#stk").querySelector("thead").onclick = e => { const th = e.target.closest("th"); if (!th) return;
    const c = th.dataset.k; if (RSST.sort === c) RSST.dir = -RSST.dir; else { RSST.sort = c; RSST.dir = ["name","sector","market"].includes(c) ? 1 : -1; } drawStocks(); };
  const more = $("#more"); more.hidden = list.length <= RSST.limit;
  more.textContent = `더 보기 (${Math.min(100, list.length - RSST.limit)}개)`;
  more.onclick = () => { RSST.limit += 100; drawStocks(); };
}

function route(){
  const h = (location.hash || "#kr").slice(1), [tab, sec] = h.split("/");
  const mode = tab === "rs" ? "rs" : "chart";
  $("#modes").innerHTML = MODES.map(([k, l]) => `<button class="mode ${k===mode?"on":""}" data-k="${k}">${l}</button>`).join("");
  $("#bar2").hidden = mode !== "chart";
  $("#asof").textContent = D && D.generated ? `업데이트 ${D.generated}` : "";
  if (mode === "rs"){ renderRS(sec ? decodeURIComponent(sec) : null); window.scrollTo(0, 0); return; }
  const t = TABS.find(x => x[0] === tab) ? tab : "kr";
  $("#tabs").innerHTML = TABS.map(([k, , l]) => `<button class="tab ${k===t?"on":""}" data-k="${k}">${l}</button>`).join("");
  if (t === "kr" && sec) renderSector(decodeURIComponent(sec)); else renderGroup(t);
  window.scrollTo(0, 0);
}
$("#modes").onclick = e => { const b = e.target.closest(".mode"); if (b) location.hash = b.dataset.k === "rs" ? "#rs" : "#kr"; };
$("#tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) location.hash = "#" + b.dataset.k; };
$("#tf").innerHTML = TF.map(([k, l]) => `<button data-k="${k}" class="${k===gTF?"on":""}">${l}봉</button>`).join("");
$("#tf").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  gTF = b.dataset.k; cardTF.clear();
  $("#tf").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".card").forEach(drawCard);
};
window.addEventListener("hashchange", route);
if (D) route(); else $("#main").innerHTML = `<div class="empty">data/overview.js 가 없습니다. <code>python -m src.dashboard.export</code> 를 먼저 실행하세요.</div>`;
</script>
</body>
