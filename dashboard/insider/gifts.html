<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증여</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><h1>증여</h1><span class="meta" id="meta"></span><span id="nav"></span></header>
<main>
  <div class="funnel" id="cards"></div>
  <div class="bar" id="bar"></div>
  <div class="bar" id="bar2"></div>
  <div class="wrap" id="table"></div>
</main>
<script src="data/main.js"></script>
<script src="common.js"></script>
<script>
const KEY='insider-gifts';
const S = loadState(KEY, {kind:'all', days:90, groups:GROUPS.slice(), market:'', minEok:0, noLate:false, view:'event', q:''});
S.groups = new Set(S.groups);
const ST = {event:{}, corp:{}};
const save = () => saveState(KEY, S, ['kind','days','groups','market','minEok','noLate','view']);
$('#nav').outerHTML = nav('gifts.html');
$('#meta').textContent = metaText();

// 증여 한 건 = 증여 쪽 행(수증자 합침), 짝 없는 수증 행, 또는 큰 그룹 내 이전
const EVENTS = D.gifts.map(g => withCorp({stock_code:g.code, rcept_dt:g.rdt, rcept_no:g.rno, date:g.date, kind:g.kind,
  giver:g.giver||'', giverRel:g.giverRel||'', holder_group:g.grp, recips:(g.rec||[]).map(([person,relation,qty])=>({person,relation,qty})),
  qty:g.qty, amount:g.amt, pct:g.pct||0, giverPct:g.giverPct, note:g.note, lag:g.lag}, D.corps));
// 비고에서 수증자 부분을 떼어 수증자 칸으로 보낸다 (공시 표에 수증자가 없을 때만 비고 글을 수증자로 씀)
const cleanName = n => { n = String(n||'').trim();
  while((n.match(/\)/g)||[]).length > (n.match(/\(/g)||[]).length) n = n.replace(/\)(?!.*\))/,'').trim();
  while((n.match(/\(/g)||[]).length > (n.match(/\)/g)||[]).length) n = n.replace(/\((?!.*\()/,'').trim();
  return n; };
// '(주)오트로닉'과 '주식회사 오트로닉'처럼 표기가 달라도 같은 이름으로 보고 지운다
const dropName = (text, n) => { const core = n.replace(/\(주\)|㈜|주식회사|\s/g,''); if(!core) return text;
  const esc2 = core.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp('(\\(주\\)|㈜|주식회사)?\\s*'+esc2+'(\\s*\\(주\\))?','g'),''); };
const REL_WORDS = /^(자녀|배우자|아들|딸|손자|손녀|자|녀|부|모|형제|친인척|특수관계인|특별관계자)(들)?$/;
const NAME_LIST = /^[가-힣]{2,4}(\s*[,·/]\s*[가-힣]{2,4})*$/;
EVENTS.forEach(e=>{
  let note = (e.note||'').trim(), rtext = '';
  let m = note.match(/수증(?:자|인)\s*[:：]?\s*\(?/);
  if(m){ rtext = note.slice(m.index+m[0].length).replace(/\)\s*$/,'').trim(); note = note.slice(0,m.index).replace(/[\s(:：\-]+$/,'').trim(); }
  else if((m = note.match(/^(?:배우자|자녀)(?=\s*증여$)/))){ rtext = m[0]; note = ''; }
  else if((m = note.match(/^증여\s*\(?\s*([가-힣]{2,4})\s*\)$/))){ rtext = m[1]; note = ''; }
  else if(!e.recips.length && (NAME_LIST.test(note) || REL_WORDS.test(note))){ rtext = note.replace(/\s*[,·/]\s*/g,', '); note = ''; }
  const names = [...new Set(e.recips.map(x=>cleanName(x.person)).filter(Boolean))];
  // 증여자 없이 수증 공시만 있는데 비고가 이름 하나면 그게 증여자
  if(!e.giver && names.length && /^[가-힣]{2,4}$/.test(note)){ e.giver = note; note = ''; }
  if(!e.giver && (m = note.match(/^([가-힣]{2,4})\s*(?:으로부터|로부터|에게서|에게)\s*수증$/))){ e.giver = m[1]; note = ''; }
  [...names, e.giver].filter(Boolean).forEach(n=>{ note = dropName(note, n); });
  note = note.replace(/^[\s,·]*에게\s*/,'');
  // 이름을 뺀 뒤 남는 '상대방:' '매수자:' '외3명' 같은 꼬리표도 지운다
  note = note.replace(/(증여거래\s*)?(매수자|매도자|증여자|매매\s*상대방|거래\s*상대방|상대방)(\s*성명)?\s*[:：]\s*(외\s*\d+\s*명)?/g,'').trim();
  note = note.replace(/\(\s*\)/g,'').trim();
  if(/^[\s,·()\-:：/]*$/.test(note)) note = '';
  e.note = note; e.recipText = names.length ? names.join(', ') : rtext;
});

function base(){
  const from = S.days ? daysAgo(S.days) : '';
  return EVENTS.filter(e => (!from || e.rcept_dt>=from) && S.groups.has(e.holder_group||'기타')
    && (!S.market || e.market===S.market) && (!S.noLate || e.lag<=30)
    && (S.kind==='all' || e.kind===S.kind) && (e.amount||0) >= S.minEok*1e8
    && (!S.q || [e.corp_name,e.stock_code,e.giver,...e.recips.map(x=>x.person)].join(' ').toLowerCase().includes(S.q.toLowerCase())));
}

function cards(E){
  const corps = new Set(E.map(e=>e.stock_code));
  $('#cards').innerHTML = cardsHTML([
    ['증여·이전 건수', E.length, `${corps.size}개 회사 · 그룹 내 이전 ${E.filter(e=>e.kind!=='증여').length}건`],
    ['증여 금액', eok(E.reduce((s,e)=>s+(e.amount||0),0))||'0', '억원 (증여일 종가 기준)'],
    ['수증자', E.reduce((s,e)=>s+e.recips.length,0), `여러 명에게 준 증여 ${E.filter(e=>e.recips.length>=2).length}건`],
  ]);
}

function bars(){
  $('#bar').innerHTML = segHTML('days',[[30,'30일'],[90,'90일'],[0,'전체']],S.days)
    + segHTML('kind',[['all','전체'],['증여','증여'],['그룹 내 이전','그룹 내 이전']],S.kind)
    + segHTML('view',[['event','건별'],['corp','회사별']],S.view)
    + `<input type="search" id="q" placeholder="종목·증여자·수증자" value="${esc(S.q)}">`;
  $('#bar2').innerHTML = `<span class="lbl">증여자</span>` + GROUPS.map(g=>`<span class="chip ${S.groups.has(g)?'on':''}" data-g="${g}">${g}</span>`).join('')
    + marketSelect(S.market)
    + `<span class="lbl">최소 금액</span><input type="number" id="minEok" min="0" step="0.5" value="${S.minEok||''}" placeholder="억원">`
    + `<label class="toggle"><input type="checkbox" id="noLate" ${S.noLate?'checked':''}>늦은 보고(30일+) 제외</label>`;
  bindSeg('days', v=>{S.days=+v; go();}); bindSeg('view', v=>{S.view=v; go();}); bindSeg('kind', v=>{S.kind=v; go();});
  $('#q').oninput = e=>{S.q=e.target.value; draw();};
  $$('[data-g]').forEach(e=>e.onclick=()=>{ const g=e.dataset.g; S.groups.has(g)?S.groups.delete(g):S.groups.add(g); go(); });
  $('#mk').onchange = e=>{S.market=e.target.value; go();};
  $('#minEok').oninput = e=>{S.minEok=+e.target.value||0; save(); draw();};
  $('#noLate').onchange = e=>{S.noLate=e.target.checked; go();};
}

const recipCell = e => `<div class="who">${esc(e.recipText)}</div>`;
const pp = v => v ? (v>=0.005?v.toFixed(2):'<0.01') : '';

function draw(){
  const E = base(); cards(E);
  const el = $('#table');
  if(S.view==='event'){
    renderTable(el, [
      ['공시일',e=>e.rcept_dt,e=>e.rcept_dt+e.rcept_no],['증여일',dateCell,e=>e.date||''],['종목',corpCell,e=>e.corp_name],['산업',secCell,secKey],
      ['증여자',e=>`<div class="who">${esc(e.giver)}</div>`,e=>e.giver],
      ['구분',e=>esc(e.holder_group||''),e=>e.holder_group],
      ['수증자',recipCell,e=>e.recipText],['수증자 수',e=>e.recips.length?fmt(e.recips.length):'',e=>e.recips.length,1],
      ['수량(주)',e=>fmt(e.qty),e=>e.qty,1],['금액(억원)',e=>eok(e.amount),e=>e.amount||0,1],
      ['지분 변동(%p)',e=>pp(e.pct),e=>e.pct,1],['증여자 지분율(%)',e=>pctAfter(e.giverPct),e=>e.giverPct??-1,1],
      ['비고',e=>`<div class="note clamp">${esc(e.note||'')}</div>`,e=>e.note||''],['',e=>dartLink(e.rcept_no),e=>0],
    ], E, ST.event);
  } else {
    const m = new Map();
    for(const e of E){
      let a=m.get(e.stock_code);
      if(!a){ a={...e, n:0, givers:new Set(), rs:new Set(), qty:0, amount:0, pct:0, first:e.date, last:e.date}; m.set(e.stock_code,a); }
      a.n++; if(e.giver) a.givers.add(e.giver); e.recips.forEach(x=>a.rs.add(x.person));
      a.qty+=e.qty||0; a.amount+=e.amount||0; a.pct+=e.pct||0;
      if(e.date<a.first) a.first=e.date; if(e.date>a.last) a.last=e.date; if(e.rcept_dt>a.rcept_dt) a.rcept_dt=e.rcept_dt;
    }
    renderTable(el, [
      ['종목',corpCell,a=>a.corp_name],['산업',secCell,secKey],['증여 건수',a=>fmt(a.n),a=>a.n,1],
      ['증여자',a=>`<div class="who">${esc([...a.givers].join(', '))}</div>`,a=>a.givers.size],
      ['수증자',a=>`<div class="who">${esc([...a.rs].join(', '))}</div>`,a=>a.rs.size],['수증자 수',a=>fmt(a.rs.size),a=>a.rs.size,1],
      ['수량(주)',a=>fmt(a.qty),a=>a.qty,1],['금액(억원)',a=>eok(a.amount),a=>a.amount,1],['지분 변동(%p)',a=>pp(a.pct),a=>a.pct,1],
      ['증여 기간',a=>`${a.first} ~ ${a.last}`,a=>a.last],['최근 공시',a=>a.rcept_dt,a=>a.rcept_dt],
    ], [...m.values()], ST.corp, a=>{ S.q=a.stock_code; S.view='event'; go(); });
  }
}
function go(){ save(); bars(); draw(); }
go();
</script>
</body>
</html>
