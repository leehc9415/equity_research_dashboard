[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "korea-investment-data"
version = "0.1.0"
description = "Small, inspectable collectors for Korea Customs Service trade APIs"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=16,<23",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[project.scripts]
kcs-sample = "investment_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
